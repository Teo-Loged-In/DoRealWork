<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DoRealWork — Trainiere deinen Fokus</title>
  <meta name="description" content="Der KI-Fokus-Coach, der deinen Fokus trainiert statt trackt — und dich stoppt, bevor du ausbrennst." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            ink: '#07070c',
            panel: '#101019',
          },
          keyframes: {
            floaty: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } },
            pulseSoft: { '0%,100%': { opacity: 1 }, '50%': { opacity: .55 } },
            fadeUp: { '0%': { opacity: 0, transform: 'translateY(12px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
          },
          animation: {
            floaty: 'floaty 4s ease-in-out infinite',
            pulseSoft: 'pulseSoft 2.4s ease-in-out infinite',
            fadeUp: 'fadeUp .5s ease both',
          }
        }
      }
    }
  </script>
  <style>
    html, body { background: #07070c; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #26263a; border-radius: 999px; }
    .glass { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); }
    .grad-text { background: linear-gradient(100deg,#a78bfa,#818cf8 40%,#f0abfc); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .btn-primary { background: linear-gradient(100deg,#6d5efc,#8b5cf6 55%,#d946ef); }
    .btn-primary:hover { filter: brightness(1.08); }
    .ambient { background:
      radial-gradient(60% 50% at 20% 0%, rgba(124,92,255,0.18), transparent 60%),
      radial-gradient(50% 45% at 90% 10%, rgba(217,70,239,0.12), transparent 60%),
      radial-gradient(55% 50% at 50% 100%, rgba(56,189,248,0.10), transparent 60%); }
    input, textarea, select { font-family: inherit; }

</head>
<body class="text-zinc-100 antialiased">
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ============================ Utils & Storage ============================ */
const todayStr = () => new Date().toISOString().slice(0, 10);
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const timeOfDay = () => {
  const h = new Date().getHours();
  if (h < 11) return 'Morgen';
  if (h < 15) return 'Mittag';
  if (h < 19) return 'Nachmittag';
  return 'Abend';
};

/* ============================ AI call (mit lokalem Fallback) ============================ */
async function askCoach(type, payload) {
  try {
    const r = await fetch('/api/coach', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ type, payload }),
    });
    const data = await r.json();
    if (data && data.ok && data.result) return { source: 'ai', ...data.result };
  } catch (_) {}
  // Fallback: lokale, regelbasierte Intelligenz -> App funktioniert IMMER
  if (type === 'plan') return { source: 'local', ...localPlan(payload) };
  if (type === 'debrief') return { source: 'local', ...localDebrief(payload) };
  return { source: 'local' };
}

function localPlan(p) {
  const base = clamp(p.baselineMinutes || 25, 10, 90);
  const cap = p.battery < 35 ? Math.round(base * 0.6) : base;
  const raw = (p.tasks || '').split(/\n|,|;|\bund\b|\+/i).map(s => s.trim()).filter(Boolean);
  const tasks = raw.length ? raw : ['Wichtigste Aufgabe'];
  const guessType = t => /lern|lesen|study|kapitel|vokab/i.test(t) ? 'learning'
    : /schreib|design|idee|konzept|kreativ/i.test(t) ? 'creative'
    : /mail|admin|orga|aufräum|planen/i.test(t) ? 'admin' : 'deep';
  const blocks = [];
  tasks.slice(0, 4).forEach((t, i) => {
    blocks.push({
      title: t.charAt(0).toUpperCase() + t.slice(1),
      minutes: clamp(cap - (i > 1 ? 5 : 0), 10, 90),
      type: guessType(t),
      why: i === 0 ? 'Wichtigstes zuerst, solange die Energie hoch ist' : 'Fokusblock in Kapazitätsgröße',
    });
  });
  const note = p.battery < 35
    ? 'Deine Brain-Battery ist niedrig — wir gehen heute mit kürzeren Blöcken vor. Qualität vor Quantität.'
    : `Klarer Plan steht. Starte mit dem ersten Block und lock dich rein — ${cap} Minuten, kein Handy.`;
  return { coachNote: note, blocks };
}

function localDebrief(p) {
  const ratio = p.planned ? p.actual / p.planned : 1;
  const dcount = (p.distractions || []).length;
  let insight, adjustment;
  if (dcount >= 3) {
    insight = `Du wurdest ${dcount}× rausgezogen — vor allem durch ${p.topDistraction || 'Ablenkungen'}. Dein Fokus bricht in Wellen.`;
    adjustment = `Entferne morgen den Auslöser vorab (z. B. Handy in anderen Raum) und mach 5 Min kürzere Blöcke.`;
  } else if (ratio < 0.7) {
    insight = 'Du hast den Block früher beendet — die geplante Länge war für heute etwas zu lang.';
    adjustment = 'Plane morgen Blöcke ~20% kürzer und häng bei Bedarf einen zweiten dran.';
  } else if (p.rating >= 4) {
    insight = 'Starke Session — du warst richtig drin und bist drangeblieben.';
    adjustment = 'Behalte die Blocklänge bei und versuch morgen einen Block mehr.';
  } else {
    insight = 'Solide Session mit Luft nach oben.';
    adjustment = 'Setz dir vor dem nächsten Block eine glasklare Mini-Intention (1 Satz).';
  }
  return { insight, adjustment, encouragement: 'Fokus ist ein Muskel — du hast ihn heute trainiert. 💪' };
}

/* ============================ Brain Battery Modell ============================ */
// Kein Wearable: geschätzt aus Schlaf, geleisteter Deep-Work-Zeit und Erholung.
function computeBatteryStart(sleepQuality, prevEnd) {
  const sleep = sleepQuality ? sleepQuality / 5 : 0.7;      // 0..1
  const carry = prevEnd != null ? prevEnd : 80;             // Rest von gestern
  return clamp(Math.round(40 + sleep * 50 + carry * 0.12), 20, 100);
}
const batteryColor = b => b > 60 ? '#34d399' : b > 35 ? '#fbbf24' : '#f87171';
const batteryLabel = b => b > 60 ? 'Voll fokusfähig' : b > 35 ? 'Achte auf Pausen' : 'Burnout-Zone — bald stoppen';

/* ============================ Root App ============================ */
function App() {
  const [profile, setProfile] = useState(() => LS.get('drw_profile', null));
  const [state, setState] = useState(() => freshOrLoad());
  const [screen, setScreen] = useState('home'); // home | session | debrief | insights
  const [activeBlock, setActiveBlock] = useState(null);
  const [lastSession, setLastSession] = useState(null);

  useEffect(() => LS.set('drw_profile', profile), [profile]);
  useEffect(() => LS.set('drw_state', state), [state]);

  function freshOrLoad() {
    const s = LS.get('drw_state', null);
    const t = todayStr();
    if (!s) {
      return { day: t, battery: 80, sleepQuality: null, blocks: [], streak: 0, lastActiveDay: null, history: [] };
    }
    if (s.day !== t) {
      // neuer Tag -> Verlauf abschließen, Battery neu
      const prevFocus = (s.blocks || []).filter(b => b.status === 'done').reduce((a, b) => a + (b.actual || b.minutes), 0);
      const prevRatings = (s.blocks || []).filter(b => b.focusRating).map(b => b.focusRating);
      const avg = prevRatings.length ? prevRatings.reduce((a, c) => a + c, 0) / prevRatings.length : 0;
      const history = [...(s.history || []), { date: s.day, focusMinutes: prevFocus, avgRating: +avg.toFixed(1), distractions: (s.blocks || []).reduce((a, b) => a + (b.distractions ? b.distractions.length : 0), 0), batteryEnd: s.battery }].slice(-30);
      return { day: t, battery: computeBatteryStart(null, s.battery), sleepQuality: null, blocks: [], streak: s.streak || 0, lastActiveDay: s.lastActiveDay, history };
    }
    return s;
  }

  if (!profile) return <Onboarding onDone={p => { setProfile(p); }} />;

  const patch = up => setState(s => ({ ...s, ...up }));

  const startBlock = b => { setActiveBlock(b); setScreen('session'); };

  const finishBlock = (block, result) => {
    // result: { actual, rating, distractions }
    setState(s => {
      const blocks = s.blocks.map(b => b.id === block.id ? { ...b, status: 'done', actual: result.actual, focusRating: result.rating, distractions: result.distractions } : b);
      const batteryDrain = clamp(Math.round(result.actual / 3) + result.distractions.length * 2, 4, 40);
      const battery = clamp(s.battery - batteryDrain, 0, 100);
      const doneToday = blocks.filter(b => b.status === 'done').length;
      const newStreak = s.lastActiveDay === todayStr() ? s.streak : (doneToday >= 1 ? (s.streak || 0) + 1 : s.streak);
      return { ...s, blocks, battery, streak: newStreak, lastActiveDay: todayStr() };
    });
    setLastSession({ block, result });
    setScreen('debrief');
  };

  const skipBlock = block => setState(s => ({ ...s, blocks: s.blocks.map(b => b.id === block.id ? { ...b, status: 'skipped' } : b) }));

  const recharge = amt => patch({ battery: clamp(state.battery + amt, 0, 100) });

  return (
    <div className="min-h-screen ambient">
      {screen === 'home' && (
        <Home profile={profile} state={state} patch={patch}
          onStart={startBlock} onSkip={skipBlock}
          onInsights={() => setScreen('insights')}
          onResetProfile={() => { setProfile(null); LS.set('drw_profile', null); }} />
      )}
      {screen === 'session' && activeBlock && (
        <Session block={activeBlock} battery={state.battery} profile={profile}
          onFinish={finishBlock} onRecharge={recharge} onExit={() => setScreen('home')} />
      )}
      {screen === 'debrief' && lastSession && (
        <Debrief session={lastSession} profile={profile} state={state}
          onDone={() => setScreen('home')} />
      )}
      {screen === 'insights' && (
        <Insights state={state} onBack={() => setScreen('home')} />
      )}
    </div>
  );
}

/* ============================ Onboarding ============================ */
function Onboarding({ onDone }) {
  const [step, setStep] = useState(0);
  const [goal, setGoal] = useState('');
  const [chronotype, setChronotype] = useState('Morgen');
  const [distraction, setDistraction] = useState('');
  const [baselineMinutes, setBaseline] = useState(25);

  const steps = [
    {
      title: 'Willkommen bei DoRealWork', emoji: '🔒',
      sub: 'Kein Tracker. Ein Coach, der deinen Fokus trainiert — und dich stoppt, bevor du ausbrennst.',
      body: <p className="text-zinc-400 text-sm leading-relaxed">In 30 Sekunden lernt dein Coach dich kennen. Danach bekommst du jeden Tag einen Plan, der zu <span className="text-zinc-200">deiner</span> Energie passt.</p>,
      next: 'Los geht\'s',
      valid: true,
    },
    {
      title: 'Worauf lockst du dich?', emoji: '🎯',
      sub: 'Dein großes Ziel gerade — je konkreter, desto besser der Plan.',
      body: <input autoFocus value={goal} onChange={e => setGoal(e.target.value)} placeholder="z. B. Abi-Prüfungen bestehen / mein Startup bauen"
        className="w-full rounded-xl bg-white/5 border border-white/10 px-4 py-3 outline-none focus:border-violet-400/60" />,
      valid: goal.trim().length > 1,
    },
    {
      title: 'Wann ist deine Energie am höchsten?', emoji: '⚡',
      sub: 'Dann legen wir deinen härtesten Block hin.',
      body: <div className="grid grid-cols-2 gap-3">
        {['Morgen', 'Mittag', 'Nachmittag', 'Abend'].map(o => (
          <button key={o} onClick={() => setChronotype(o)}
            className={'rounded-xl px-4 py-3 border transition ' + (chronotype === o ? 'btn-primary border-transparent text-white' : 'bg-white/5 border-white/10 hover:border-white/25')}>{o}</button>
        ))}
      </div>,
      valid: true,
    },
    {
      title: 'Was zieht dich am meisten raus?', emoji: '📵',
      sub: 'Deinen größten Fokus-Leak greifen wir gezielt an.',
      body: <div className="grid grid-cols-2 gap-3">
        {['Handy / Social Media', 'YouTube / Streaming', 'Gedankenkreisen', 'Andere Menschen', 'Snacken / Aufstehen', 'Multitasking'].map(o => (
          <button key={o} onClick={() => setDistraction(o)}
            className={'rounded-xl px-3 py-3 text-sm border transition ' + (distraction === o ? 'btn-primary border-transparent text-white' : 'bg-white/5 border-white/10 hover:border-white/25')}>{o}</button>
        ))}
      </div>,
      valid: distraction.length > 0,
    },
    {
      title: 'Wie lange kannst du aktuell am Stück fokussieren?', emoji: '⏳',
      sub: 'Ehrlich sein — wir bauen es von hier aus aus.',
      body: <div>
        <div className="text-center text-5xl font-black grad-text mb-4">{baselineMinutes}<span className="text-2xl text-zinc-500 font-bold"> Min</span></div>
        <input type="range" min="10" max="90" step="5" value={baselineMinutes} onChange={e => setBaseline(+e.target.value)} className="w-full accent-violet-500" />
        <div className="flex justify-between text-xs text-zinc-500 mt-1"><span>10</span><span>90</span></div>
      </div>,
      valid: true,
    },
  ];

  const cur = steps[step];
  const last = step === steps.length - 1;

  return (
    <div className="min-h-screen flex items-center justify-center p-5">
      <div className="w-full max-w-md glass rounded-3xl p-7 animate-fadeUp">
        <div className="flex gap-1.5 mb-6">
          {steps.map((_, i) => <div key={i} className={'h-1 flex-1 rounded-full ' + (i <= step ? 'bg-violet-500' : 'bg-white/10')} />)}
        </div>
        <div className="text-4xl mb-3">{cur.emoji}</div>
        <h1 className="text-2xl font-extrabold mb-1">{cur.title}</h1>
        <p className="text-zinc-400 text-sm mb-5">{cur.sub}</p>
        <div className="mb-6">{cur.body}</div>
        <div className="flex gap-3">
          {step > 0 && <button onClick={() => setStep(step - 1)} className="px-4 py-3 rounded-xl bg-white/5 border border-white/10 hover:border-white/25 text-sm">Zurück</button>}
          <button disabled={!cur.valid}
            onClick={() => last ? onDone({ goal, chronotype, distraction, baselineMinutes, onboarded: true }) : setStep(step + 1)}
            className={'flex-1 px-4 py-3 rounded-xl font-semibold text-white transition ' + (cur.valid ? 'btn-primary' : 'bg-white/5 text-zinc-500 cursor-not-allowed')}>
            {last ? 'Coach aktivieren →' : (cur.next || 'Weiter')}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================ Home / Today ============================ */
function Home({ profile, state, patch, onStart, onSkip, onInsights, onResetProfile }) {
  const [tasks, setTasks] = useState('');
  const [loading, setLoading] = useState(false);
  const [coachNote, setCoachNote] = useState('');
  const [aiSource, setAiSource] = useState(null);

  const done = state.blocks.filter(b => b.status === 'done');
  const focusToday = done.reduce((a, b) => a + (b.actual || b.minutes), 0);

  async function generate() {
    if (!tasks.trim()) return;
    setLoading(true);
    const res = await askCoach('plan', {
      goal: profile.goal, chronotype: profile.chronotype, distraction: profile.distraction,
      baselineMinutes: profile.baselineMinutes, battery: state.battery, timeOfDay: timeOfDay(), tasks,
    });
    setCoachNote(res.coachNote || '');
    setAiSource(res.source);
    const blocks = (res.blocks || []).map(b => ({ ...b, id: uid(), status: 'todo', distractions: [] }));
    patch({ blocks: [...state.blocks.filter(b => b.status !== 'todo'), ...blocks] });
    setLoading(false);
    setTasks('');
  }

  const todo = state.blocks.filter(b => b.status === 'todo');

  return (
    <div className="max-w-2xl mx-auto px-5 pb-24 pt-8">
      {/* Header */}
      <div className="flex items-center justify-between mb-6">
        <div>
          <div className="text-xs uppercase tracking-widest text-violet-300/80 font-semibold">{timeOfDay()} · {profile.chronotype}-Typ</div>
          <h1 className="text-2xl font-extrabold">Do <span className="grad-text">Real</span> Work</h1>
        </div>
        <div className="flex items-center gap-2">
          <Streak n={state.streak} />
          <button onClick={onInsights} title="Fortschritt" className="w-10 h-10 rounded-xl glass grid place-items-center hover:border-white/25">📈</button>
        </div>
      </div>

      {/* Brain Battery */}
      <BrainBattery battery={state.battery} sleepQuality={state.sleepQuality}
        onSleep={q => patch({ battery: computeBatteryStart(q, null), sleepQuality: q })} />

      {/* Goal chip */}
      <div className="glass rounded-2xl px-4 py-3 mt-4 flex items-center gap-3">
        <span className="text-lg">🎯</span>
        <div className="text-sm"><span className="text-zinc-400">Du lockst dich auf:</span> <span className="font-semibold">{profile.goal}</span></div>
      </div>

      {/* Planner */}
      <div className="mt-5">
        <label className="text-sm font-semibold text-zinc-300">Was steht heute an?</label>
        <p className="text-xs text-zinc-500 mb-2">Wirf alles rein — der Coach baut daraus deine Fokus-Blöcke.</p>
        <textarea value={tasks} onChange={e => setTasks(e.target.value)} rows={3}
          placeholder="z. B. Mathe Kapitel 5 lernen, Essay schreiben, Mails beantworten"
          className="w-full rounded-2xl bg-white/5 border border-white/10 px-4 py-3 outline-none focus:border-violet-400/60 resize-none" />
        <button onClick={generate} disabled={loading || !tasks.trim()}
          className={'w-full mt-2 py-3 rounded-2xl font-semibold text-white transition ' + (loading || !tasks.trim() ? 'bg-white/5 text-zinc-500' : 'btn-primary')}>
          {loading ? 'Coach denkt nach…' : '⚡ Meinen Tag planen'}
        </button>
      </div>

      {/* Coach note */}
      {coachNote && (
        <div className="glass rounded-2xl p-4 mt-4 animate-fadeUp border-l-2 border-l-violet-400/70">
          <div className="flex items-center gap-2 text-xs text-violet-300/80 mb-1 font-semibold">
            <span>🧠 Dein Coach</span>
            {aiSource === 'local' && <span className="text-zinc-500 font-normal">(Offline-Modus)</span>}
          </div>
          <p className="text-sm text-zinc-200 leading-relaxed">{coachNote}</p>
        </div>
      )}

      {/* Blocks */}
      {todo.length > 0 && (
        <div className="mt-6">
          <h2 className="text-sm font-semibold text-zinc-300 mb-3">Heutige Fokus-Blöcke</h2>
          <div className="space-y-3">
            {todo.map(b => <BlockCard key={b.id} b={b} onStart={() => onStart(b)} onSkip={() => onSkip(b)} />)}
          </div>
        </div>
      )}

      {/* Done today */}
      {done.length > 0 && (
        <div className="mt-6">
          <div className="flex items-center justify-between text-sm text-zinc-400 mb-2">
            <span>Heute geschafft</span><span className="font-semibold text-emerald-400">{focusToday} Fokus-Min</span>
          </div>
          <div className="space-y-2">
            {done.map(b => (
              <div key={b.id} className="flex items-center gap-3 text-sm glass rounded-xl px-4 py-2.5 opacity-80">
                <span className="text-emerald-400">✓</span>
                <span className="flex-1 line-through decoration-zinc-600">{b.title}</span>
                <span className="text-zinc-500">{b.actual || b.minutes}′</span>
                {b.focusRating && <span className="text-amber-300">{'★'.repeat(b.focusRating)}</span>}
              </div>
            ))}
          </div>
        </div>
      )}

      {todo.length === 0 && done.length === 0 && (
        <div className="text-center text-zinc-500 text-sm mt-10 animate-floaty">
          <div className="text-4xl mb-2">🎯</div>
          Plane deinen Tag, um deinen ersten Block zu starten.
        </div>
      )}

      <button onClick={onResetProfile} className="block mx-auto mt-10 text-xs text-zinc-600 hover:text-zinc-400">Profil zurücksetzen</button>
    </div>
  );
}

const TYPE_META = {
  deep: { icon: '🧠', label: 'Deep Work', ring: 'ring-violet-400/40' },
  learning: { icon: '📚', label: 'Lernen', ring: 'ring-sky-400/40' },
  creative: { icon: '✨', label: 'Kreativ', ring: 'ring-fuchsia-400/40' },
  admin: { icon: '🗂️', label: 'Admin', ring: 'ring-zinc-400/30' },
};

function BlockCard({ b, onStart, onSkip }) {
  const m = TYPE_META[b.type] || TYPE_META.deep;
  return (
    <div className={'glass rounded-2xl p-4 ring-1 ' + m.ring + ' animate-fadeUp'}>
      <div className="flex items-start gap-3">
        <div className="text-2xl">{m.icon}</div>
        <div className="flex-1 min-w-0">
          <div className="font-semibold truncate">{b.title}</div>
          <div className="text-xs text-zinc-400 mt-0.5">{m.label} · {b.minutes} Min</div>
          {b.why && <div className="text-xs text-zinc-500 mt-1 italic">„{b.why}"</div>}
        </div>
      </div>
      <div className="flex gap-2 mt-3">
        <button onClick={onStart} className="flex-1 btn-primary py-2.5 rounded-xl font-semibold text-white text-sm">🔒 Lock in</button>
        <button onClick={onSkip} className="px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 hover:border-white/25 text-sm text-zinc-400">Skip</button>
      </div>
    </div>
  );
}

function Streak({ n }) {
  return (
    <div className="flex items-center gap-1.5 glass rounded-xl px-3 h-10" title="Fokus-Streak">
      <span className={n > 0 ? '' : 'grayscale opacity-50'}>🔥</span>
      <span className="font-bold">{n}</span>
    </div>
  );
}

/* ============================ Brain Battery Widget ============================ */
function BrainBattery({ battery, sleepQuality, onSleep }) {
  const color = batteryColor(battery);
  const r = 52, circ = 2 * Math.PI * r;
  return (
    <div className="glass rounded-3xl p-5 flex items-center gap-5">
      <div className="relative w-32 h-32 shrink-0">
        <svg viewBox="0 0 130 130" className="w-full h-full -rotate-90">
          <circle cx="65" cy="65" r={r} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="10" />
          <circle cx="65" cy="65" r={r} fill="none" stroke={color} strokeWidth="10" strokeLinecap="round"
            strokeDasharray={circ} strokeDashoffset={circ * (1 - battery / 100)} style={{ transition: 'stroke-dashoffset .8s ease, stroke .5s' }} />
        </svg>
        <div className="absolute inset-0 grid place-items-center">
          <div className="text-center">
            <div className="text-3xl font-black" style={{ color }}>{battery}</div>
            <div className="text-[10px] uppercase tracking-wider text-zinc-500">Battery</div>
          </div>
        </div>
      </div>
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2">
          <span className="text-lg">🔋</span>
          <h3 className="font-bold">Brain Battery</h3>
        </div>
        <p className="text-sm mt-0.5" style={{ color }}>{batteryLabel(battery)}</p>
        {sleepQuality == null ? (
          <div className="mt-3">
            <div className="text-xs text-zinc-400 mb-1.5">Wie hast du geschlafen? (kalibriert deine Battery)</div>
            <div className="flex gap-1.5">
              {[1, 2, 3, 4, 5].map(q => (
                <button key={q} onClick={() => onSleep(q)}
                  className="w-9 h-9 rounded-lg bg-white/5 border border-white/10 hover:border-violet-400/60 text-sm">{q}</button>
              ))}
            </div>
          </div>
        ) : (
          <p className="text-xs text-zinc-500 mt-2">Sinkt bei Deep Work, lädt bei echten Pausen & Schlaf. Kein Wearable nötig.</p>
        )}
      </div>
    </div>
  );
}

/* ============================ Session (Locked-in mode) ============================ */
const RECOVERIES = [
  { icon: '🌬️', t: 'Box-Breathing', d: '4 Sek ein · 4 halten · 4 aus · 4 halten. 4 Runden.', amt: 8 },
  { icon: '🚶', t: 'Kurzer Walk', d: '2 Minuten laufen — am besten raus oder ans Fenster.', amt: 10 },
  { icon: '☀️', t: 'Licht tanken', d: '2 Min Tageslicht / ans Fenster. Blick in die Ferne.', amt: 9 },
  { icon: '💧', t: 'Wasser + Weg vom Screen', d: 'Trink ein Glas Wasser, Augen vom Bildschirm.', amt: 7 },
];

function Session({ block, battery, profile, onFinish, onRecharge, onExit }) {
  const total = block.minutes * 60;
  const [left, setLeft] = useState(total);
  const [running, setRunning] = useState(true);
  const [distractions, setDistractions] = useState([]);
  const [phase, setPhase] = useState('focus'); // focus | recovery
  const [recovery, setRecovery] = useState(null);
  const startedAt = useRef(Date.now());

  useEffect(() => {
    if (!running || phase !== 'focus') return;
    const id = setInterval(() => setLeft(l => {
      if (l <= 1) { clearInterval(id); complete(true); return 0; }
      return l - 1;
    }), 1000);
    return () => clearInterval(id);
  }, [running, phase]);

  const elapsedMin = () => Math.max(1, Math.round((total - left) / 60));

  function logDistraction() {
    setDistractions(d => [...d, { at: elapsedMin(), type: profile.distraction }]);
  }

  function complete(natural) {
    const actual = natural ? block.minutes : elapsedMin();
    // Erst Erholung anbieten, dann Debrief
    const rec = RECOVERIES[Math.floor(Math.random() * RECOVERIES.length)];
    setRecovery({ rec, actual });
    setPhase('recovery');
  }

  const pct = ((total - left) / total) * 100;
  const mm = String(Math.floor(left / 60)).padStart(2, '0');
  const ss = String(left % 60).padStart(2, '0');
  const lowBattery = battery < 35;

  if (phase === 'recovery' && recovery) {
    return (
      <div className="min-h-screen flex items-center justify-center p-6 text-center">
        <div className="max-w-sm w-full animate-fadeUp">
          <div className="text-6xl mb-4 animate-floaty">{recovery.rec.icon}</div>
          <div className="text-xs uppercase tracking-widest text-emerald-300/80 font-semibold mb-1">Erholung · schützt deine Battery</div>
          <h2 className="text-2xl font-extrabold mb-2">{recovery.rec.t}</h2>
          <p className="text-zinc-400 mb-6">{recovery.rec.d}</p>
          <button onClick={() => { onRecharge(recovery.rec.amt); onFinish(block, { actual: recovery.actual, rating: 0, distractions, pendingRating: true }); }}
            className="w-full btn-primary py-3.5 rounded-2xl font-semibold text-white">Erholt — weiter zum Debrief</button>
          <button onClick={() => onFinish(block, { actual: recovery.actual, rating: 0, distractions })}
            className="w-full mt-2 py-3 text-sm text-zinc-500 hover:text-zinc-300">Überspringen</button>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen flex flex-col">
      <div className="flex items-center justify-between p-5">
        <button onClick={onExit} className="text-sm text-zinc-500 hover:text-zinc-300">← Beenden</button>
        <div className="text-xs text-zinc-500">Battery {battery}</div>
      </div>

      <div className="flex-1 flex flex-col items-center justify-center px-6 -mt-8">
        <div className="text-xs uppercase tracking-widest text-violet-300/80 font-semibold mb-2">🔒 Locked in</div>
        <h2 className="text-xl font-bold text-center mb-1 max-w-sm">{block.title}</h2>
        {block.why && <p className="text-xs text-zinc-500 mb-8 text-center max-w-xs">„{block.why}"</p>}

        <div className="relative w-72 h-72 my-2">
          <svg viewBox="0 0 200 200" className="w-full h-full -rotate-90">
            <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="6" />
            <circle cx="100" cy="100" r="88" fill="none" stroke="url(#g)" strokeWidth="6" strokeLinecap="round"
              strokeDasharray={2 * Math.PI * 88} strokeDashoffset={2 * Math.PI * 88 * (1 - pct / 100)} style={{ transition: 'stroke-dashoffset 1s linear' }} />
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#8b5cf6" /><stop offset="1" stopColor="#d946ef" /></linearGradient></defs>
          </svg>
          <div className="absolute inset-0 grid place-items-center">
            <div className="text-center">
              <div className="text-6xl font-black tabular-nums">{mm}:{ss}</div>
              <div className="text-xs text-zinc-500 mt-1">{running ? 'in Progress' : 'pausiert'}</div>
            </div>
          </div>
        </div>

        {lowBattery && (
          <div className="glass rounded-xl px-4 py-2 mt-2 text-xs text-amber-300 border border-amber-400/20">
            ⚠️ Niedrige Battery — halte diesen Block kurz und gönn dir danach echte Erholung.
          </div>
        )}

        <div className="flex items-center gap-3 mt-8">
          <button onClick={() => setRunning(r => !r)} className="w-14 h-14 rounded-full glass grid place-items-center text-xl hover:border-white/30">{running ? '⏸' : '▶'}</button>
          <button onClick={() => complete(false)} className="px-6 h-14 rounded-full btn-primary font-semibold text-white">Block beenden</button>
        </div>

        <button onClick={logDistraction} className="mt-6 text-sm text-zinc-500 hover:text-amber-300 transition">
          😵‍💫 Ich hab mich ablenken lassen {distractions.length > 0 && <span className="text-amber-300 font-semibold">({distractions.length})</span>}
        </button>
        <p className="text-[11px] text-zinc-600 mt-1 max-w-xs text-center">Ein Tap, wenn du abdriftest — kein Urteil. Der Coach lernt daraus dein Muster.</p>
      </div>
    </div>
  );
}

/* ============================ Debrief ============================ */
function Debrief({ session, profile, state, onDone }) {
  const { block, result } = session;
  const [rating, setRating] = useState(0);
  const [extraDistractions, setExtra] = useState(result.distractions || []);
  const [loading, setLoading] = useState(false);
  const [insight, setInsight] = useState(null);

  const distractionTypes = ['Handy', 'Social Media', 'Gedanken', 'Menschen', 'Müdigkeit', 'Langeweile'];

  const topDistraction = useMemo(() => {
    const all = [...(state.blocks || [])].flatMap(b => b.distractions || []).map(d => d.type);
    const c = {}; all.forEach(t => c[t] = (c[t] || 0) + 1);
    return Object.entries(c).sort((a, b) => b[1] - a[1])[0]?.[0] || profile.distraction;
  }, []);

  async function analyze() {
    setLoading(true);
    const res = await askCoach('debrief', {
      planned: block.minutes, actual: result.actual, rating,
      distractions: extraDistractions, topDistraction,
      history: (state.history || []).slice(-5), profileDistraction: profile.distraction,
    });
    setInsight(res);
    setLoading(false);
  }

  if (insight) {
    return (
      <div className="min-h-screen flex items-center justify-center p-6">
        <div className="max-w-md w-full glass rounded-3xl p-7 animate-fadeUp">
          <div className="text-4xl mb-3">🧠</div>
          <div className="text-xs uppercase tracking-widest text-violet-300/80 font-semibold mb-3">
            Coach-Analyse {insight.source === 'local' && <span className="text-zinc-500">(Offline)</span>}
          </div>
          <div className="space-y-4">
            <div>
              <div className="text-xs text-zinc-500 mb-1">Muster erkannt</div>
              <p className="text-zinc-100">{insight.insight}</p>
            </div>
            <div className="glass rounded-2xl p-4 border-l-2 border-l-emerald-400/70">
              <div className="text-xs text-emerald-300/80 mb-1 font-semibold">✅ Für morgen</div>
              <p className="text-sm text-zinc-100">{insight.adjustment}</p>
            </div>
            {insight.encouragement && <p className="text-sm text-zinc-400 italic">{insight.encouragement}</p>}
          </div>
          <button onClick={onDone} className="w-full btn-primary py-3.5 rounded-2xl font-semibold text-white mt-6">Weiter →</button>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="max-w-md w-full glass rounded-3xl p-7 animate-fadeUp">
        <div className="text-xs uppercase tracking-widest text-violet-300/80 font-semibold mb-1">Session-Debrief</div>
        <h2 className="text-2xl font-extrabold mb-1">{block.title}</h2>
        <p className="text-zinc-400 text-sm mb-6">{result.actual} von {block.minutes} Min fokussiert.</p>

        <div className="mb-6">
          <div className="text-sm font-semibold mb-2">Wie fokussiert warst du?</div>
          <div className="flex gap-2">
            {[1, 2, 3, 4, 5].map(s => (
              <button key={s} onClick={() => setRating(s)}
                className={'flex-1 h-12 rounded-xl border text-lg transition ' + (rating >= s ? 'bg-amber-400/20 border-amber-400/50 text-amber-300' : 'bg-white/5 border-white/10')}>★</button>
            ))}
          </div>
        </div>

        <div className="mb-6">
          <div className="text-sm font-semibold mb-2">Was hat dich rausgezogen? <span className="text-zinc-500 font-normal">(optional)</span></div>
          <div className="flex flex-wrap gap-2">
            {distractionTypes.map(d => {
              const active = extraDistractions.some(x => x.type === d);
              return (
                <button key={d} onClick={() => setExtra(prev => active ? prev.filter(x => x.type !== d) : [...prev, { type: d, at: 0 }])}
                  className={'px-3 py-1.5 rounded-full text-sm border transition ' + (active ? 'bg-violet-500/25 border-violet-400/50 text-violet-200' : 'bg-white/5 border-white/10 text-zinc-400 hover:border-white/25')}>{d}</button>
              );
            })}
          </div>
        </div>

        <button onClick={analyze} disabled={loading || rating === 0}
          className={'w-full py-3.5 rounded-2xl font-semibold text-white transition ' + (loading || rating === 0 ? 'bg-white/5 text-zinc-500' : 'btn-primary')}>
          {loading ? 'Coach analysiert…' : '🧠 Analyse & Tipp für morgen'}
        </button>
      </div>
    </div>
  );
}

/* ============================ Insights ============================ */
function Insights({ state, onBack }) {
  const hist = state.history || [];
  const today = {
    date: todayStr(),
    focusMinutes: state.blocks.filter(b => b.status === 'done').reduce((a, b) => a + (b.actual || b.minutes), 0),
  };
  const series = [...hist, today].slice(-10);
  const maxM = Math.max(30, ...series.map(s => s.focusMinutes));
  const totalMin = series.reduce((a, s) => a + s.focusMinutes, 0);

  // Ablenkungs-Aggregat
  const distr = {};
  [...(state.blocks || [])].flatMap(b => b.distractions || []).forEach(d => distr[d.type] = (distr[d.type] || 0) + 1);
  const topDistr = Object.entries(distr).sort((a, b) => b[1] - a[1]).slice(0, 4);

  return (
    <div className="max-w-2xl mx-auto px-5 pb-24 pt-8">
      <div className="flex items-center gap-3 mb-6">
        <button onClick={onBack} className="w-10 h-10 rounded-xl glass grid place-items-center hover:border-white/25">←</button>
        <h1 className="text-2xl font-extrabold">Dein Fortschritt</h1>
      </div>

      <div className="grid grid-cols-3 gap-3 mb-6">
        <Stat label="Streak" value={state.streak} suffix="🔥" />
        <Stat label="Fokus gesamt" value={totalMin} suffix="min" />
        <Stat label="Ø / Tag" value={series.length ? Math.round(totalMin / series.length) : 0} suffix="min" />
      </div>

      <div className="glass rounded-3xl p-5 mb-6">
        <h3 className="font-bold mb-4">Fokus-Minuten pro Tag</h3>
        <div className="flex items-end gap-2 h-40">
          {series.map((s, i) => (
            <div key={i} className="flex-1 flex flex-col items-center gap-1 group">
              <div className="w-full rounded-t-lg btn-primary transition-all" style={{ height: `${(s.focusMinutes / maxM) * 100}%`, minHeight: s.focusMinutes ? '4px' : '0' }} title={`${s.focusMinutes} min`}></div>
              <div className="text-[9px] text-zinc-600">{s.date.slice(5)}</div>
            </div>
          ))}
        </div>
        <p className="text-xs text-zinc-500 mt-3">Deine Fokus-Kapazität wächst mit jedem Block — das ist Training, kein Tracking.</p>
      </div>

      <div className="glass rounded-3xl p-5">
        <h3 className="font-bold mb-4">Deine größten Fokus-Leaks</h3>
        {topDistr.length === 0 ? (
          <p className="text-sm text-zinc-500">Noch keine Ablenkungen erfasst. Logge sie in Sessions, damit der Coach dein Muster findet.</p>
        ) : (
          <div className="space-y-2.5">
            {topDistr.map(([t, n]) => {
              const max = topDistr[0][1];
              return (
                <div key={t} className="flex items-center gap-3">
                  <div className="w-28 text-sm text-zinc-300 truncate">{t}</div>
                  <div className="flex-1 h-3 rounded-full bg-white/5 overflow-hidden">
                    <div className="h-full rounded-full" style={{ width: `${(n / max) * 100}%`, background: 'linear-gradient(90deg,#fbbf24,#f87171)' }}></div>
                  </div>
                  <div className="text-xs text-zinc-500 w-6 text-right">{n}×</div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function Stat({ label, value, suffix }) {
  return (
    <div className="glass rounded-2xl p-4 text-center">
      <div className="text-2xl font-black grad-text">{value}<span className="text-sm text-zinc-500 font-bold ml-0.5">{suffix}</span></div>
      <div className="text-[11px] uppercase tracking-wider text-zinc-500 mt-0.5">{label}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
