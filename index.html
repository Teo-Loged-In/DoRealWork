async function ensureNotify() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  try { const p = await Notification.requestPermission(); return p === 'granted'; } catch { return false; }
}

/* ============================ Accounts (lokal, Demo) ============================ */
// Hinweis: Das ist eine lokale Demo-Anmeldung (Konten im Browser). Passwörter werden GEHASHT (SHA-256)
// gespeichert, nie im Klartext. Echte, geräteübergreifende Accounts kommen mit dem Backend (siehe Setup).
async function hashPassword(pw) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('drw::' + pw));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (_) {
    // Fallback (unsichere Notlösung, falls crypto.subtle fehlt) – nur damit die Demo nie crasht
    let h = 0; const s = 'drw::' + pw; for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
    return 'fb' + (h >>> 0).toString(16);
  }
}
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e || '').trim());
const getAccounts = () => LS.get('drw_accounts', {});
async function createAccount(email, pw, name) {
  const key = String(email).trim().toLowerCase();
  const accs = getAccounts();
  if (accs[key]) return { ok: false, error: 'Für diese E-Mail gibt es schon ein Konto. Bitte einloggen.' };
  accs[key] = { email: email.trim(), name: (name || '').trim(), passHash: await hashPassword(pw), createdAt: new Date().toISOString() };
  LS.set('drw_accounts', accs);
  return { ok: true, email: email.trim(), name: (name || '').trim() };
}
async function loginAccount(email, pw) {
  const key = String(email).trim().toLowerCase();
  const accs = getAccounts();
  const a = accs[key];
  if (!a) return { ok: false, error: 'Kein Konto mit dieser E-Mail. Erstelle zuerst eins.' };
  if (a.passHash !== await hashPassword(pw)) return { ok: false, error: 'Passwort stimmt nicht.' };
  return { ok: true, email: a.email, name: a.name || '' };
}

/* ============================ Kalender-Export (.ics für Apple/Google) ============================ */
function pad2(n) { return String(n).padStart(2, '0'); }
function icsStamp(d) {
  return d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) + 'T' +
    pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + 'Z';
}
// Plant Blöcke ab "start" nacheinander (inkl. ihrer Minuten) und baut daraus eine .ics-Datei.
function blocksToICS(blocks, start = new Date()) {
  let cursor = new Date(start.getTime());
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//DoRealWork//Rex Coach//DE', 'CALSCALE:GREGORIAN'];
  (blocks || []).forEach((b, i) => {
    const startD = new Date(cursor.getTime());
    const endD = new Date(cursor.getTime() + (b.minutes || 25) * 60000);
    lines.push('BEGIN:VEVENT',
      'UID:' + (b.id || uid()) + '-' + startD.getTime() + '@dorealwork',
      'DTSTAMP:' + icsStamp(new Date()),
      'DTSTART:' + icsStamp(startD),
      'DTEND:' + icsStamp(endD),
      'SUMMARY:' + String(b.title || 'Fokus-Block').replace(/[\n,;]/g, ' '),
      'DESCRIPTION:' + String(b.why || 'Von deinem Coach Rex geplant.').replace(/[\n,;]/g, ' '),
      'END:VEVENT');
    cursor = new Date(endD.getTime() + 5 * 60000); // 5 Min Puffer zwischen Terminen
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadICS(blocks) {
  const ics = blocksToICS((blocks || []).filter(b => b.status !== 'done'));
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'dorealwork-plan.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ============================ Datei-Anhänge (Chat) ============================ */
function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[data-src="${src}"]`)) return resolve();
    const s = document.createElement('script'); s.src = src; s.setAttribute('data-src', src);
    s.onload = () => resolve(); s.onerror = () => reject(new Error('load failed'));
    document.head.appendChild(s);
  });
}
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => { const res = String(r.result); const i = res.indexOf(','); resolve(res.slice(i + 1)); };
    r.onerror = reject; r.readAsDataURL(file);
  });
}
function fileToText(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader(); r.onload = () => resolve(String(r.result)); r.onerror = reject; r.readAsText(file);
  });
}
async function extractPdfText(file) {
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  const pdfjsLib = window.pdfjsLib;
  try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch (_) {}
  const buf = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  const pages = Math.min(doc.numPages, 30);
  for (let i = 1; i <= pages; i++) { const page = await doc.getPage(i); const c = await page.getTextContent(); text += c.items.map(it => it.str).join(' ') + '\n'; }
  return text.slice(0, 16000);
}
// Liest eine Datei ein -> { name, kind:'image'|'text', mediaType?, data?(base64), text? }
async function readAttachment(file) {
  const name = file.name || 'Datei';
  if (file.type && file.type.startsWith('image/')) {
    return { name, kind: 'image', mediaType: file.type, data: await fileToBase64(file) };
  }
  if (file.type === 'application/pdf' || /\.pdf$/i.test(name)) {
    try { return { name, kind: 'text', text: await extractPdfText(file) }; }
    catch (e) { return { name, kind: 'text', text: '', error: 'PDF konnte nicht gelesen werden.' }; }
  }
  // txt, md, csv, json, code etc.
  try { return { name, kind: 'text', text: (await fileToText(file)).slice(0, 16000) }; }
  catch (e) { return { name, kind: 'text', text: '', error: 'Datei konnte nicht gelesen werden.' }; }
}

const TRIAL_DAYS = 7;
const DAY_MS = 86400000;
const PLANS = {

function subState(sub) {
  if (!sub || sub.status === 'none') return 'none';
  if (sub.status === 'active') return 'active';
  if (sub.status === 'free') return 'free';          // Gratis-Version: App voll nutzbar, kein Pro
  if (sub.status === 'canceled') return 'free';       // Kündigen sperrt NICHT mehr -> zurück zur Gratis-Version
  if (sub.status === 'trial') {
    const end = new Date(sub.trialStart).getTime() + TRIAL_DAYS * DAY_MS;
    return Date.now() < end ? 'trial' : 'free';       // Trial-Ende sperrt NICHT mehr -> Gratis-Version
  }
  return sub.status;
}
function trialDaysLeft(sub) {
  if (!sub || !sub.trialStart) return 0;
  const end = new Date(sub.trialStart).getTime() + TRIAL_DAYS * DAY_MS;
  return Math.max(0, Math.ceil((end - Date.now()) / DAY_MS));
}

async function askCoach(type, payload) {

    const r = await fetch('/api/coach', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ type, payload }) });

function localPlan(p) {
  const base = clamp(p.baselineMinutes || 25, 10, 90);
  const cap = p.battery < 35 ? Math.round(base * 0.6) : base;
  const raw = (p.tasks || '').split(/\n|,|;|\bund\b|\+/i).map(s => s.trim()).filter(Boolean);
  const tasks = raw.length ? raw : ['Wichtigste Aufgabe'];
  const guessType = t => /lern|lesen|study|kapitel|vokab/i.test(t) ? 'learning' : /schreib|design|idee|konzept|kreativ/i.test(t) ? 'creative' : /mail|admin|orga|aufräum|planen/i.test(t) ? 'admin' : 'deep';
  // Priorität aus "!", "wichtig", "dringend" ableiten -> wichtige Aufgaben zuerst
  const prio = t => (/(!|wichtig|dringend|deadline|zuerst)/i.test(t) ? 0 : 1);
  const ordered = tasks.map((t, i) => ({ t: t.replace(/\s*(!+|\(wichtig\)|wichtig|dringend)\s*/gi, '').trim() || t, i, p: prio(t) })).sort((a, b) => a.p - b.p || a.i - b.i);
  const work = ordered.slice(0, 4).map((o, i) => ({ title: o.t.charAt(0).toUpperCase() + o.t.slice(1), minutes: clamp(cap - (i > 1 ? 5 : 0), 10, 90), type: guessType(o.t), why: i === 0 ? 'Wichtigstes zuerst, solange die Energie hoch ist' : 'Fokusblock in Kapazitätsgröße' }));
  // Pausen einplanen: nach jedem Fokusblock (außer dem letzten) eine echte Erholung; nach ~2 Blöcken länger (Essen/Klo)
  const blocks = [];
  work.forEach((b, i) => {
    blocks.push(b);
    if (i < work.length - 1) {
      const long = (i + 1) % 2 === 0;
      blocks.push({ title: long ? 'Pause – Snack/Essen & aufstehen' : 'Kurze Pause – Wasser, Klo, Augen weg vom Screen', minutes: long ? 15 : 5, type: 'break', why: 'Erholung schützt deine Brain-Battery und den Fokus danach.' });
    }
  });
  const note = p.battery < 35 ? 'Deine Brain-Battery ist niedrig — kürzere Blöcke, Qualität vor Quantität, und halte die Pausen ein.' : `Klarer Plan mit Pausen steht. Starte mit Block 1 und lock dich rein — ${cap} Min, kein Handy.`;
  return { coachNote: note, blocks };
}
function localDebrief(p) {
  const ratio = p.planned ? p.actual / p.planned : 1;
  const dcount = (p.distractions || []).length;

  if (dcount >= 3) { insight = `Du wurdest ${dcount}× rausgezogen — vor allem durch ${p.topDistraction || 'Ablenkungen'}.`; adjustment = 'Entferne morgen den Auslöser vorab und mach 5 Min kürzere Blöcke.'; }
  else if (ratio < 0.7) { insight = 'Du hast früher beendet — die Länge war heute etwas zu lang.'; adjustment = 'Plane morgen ~20% kürzere Blöcke.'; }
  else if (p.rating >= 4) { insight = 'Starke Session — du warst richtig drin.'; adjustment = 'Blocklänge beibehalten, morgen einen Block mehr.'; }
  else { insight = 'Solide Session mit Luft nach oben.'; adjustment = 'Setz dir vor dem Block eine glasklare Mini-Intention.'; }
  return { insight, adjustment, encouragement: 'Fokus ist ein Muskel — heute trainiert. 💪' };
}

/* ============================ Brain Battery ============================ */
function computeBatteryStart(sleepQuality, prevEnd) {
  const sleep = sleepQuality ? sleepQuality / 5 : 0.7;
  const carry = prevEnd != null ? prevEnd : 80;
  return clamp(Math.round(40 + sleep * 50 + carry * 0.12), 20, 100);
}

const batteryLabel = b => b > 60 ? 'Voll fokusfähig' : b > 35 ? 'Achte auf Pausen' : 'Burnout-Zone — bald stoppen';

/* ============================ Mini Markdown (fett) ============================ */
function mdInline(s) {
  const parts = String(s).split(/(\*\*[^*]+\*\*)/g);
  return parts.map((p, i) => p.startsWith('**') && p.endsWith('**') ? <strong key={i}>{p.slice(2, -2)}</strong> : <span key={i}>{p}</span>);
}
function ChatText({ text }) {
  return <div className="prose-chat text-sm leading-relaxed">{String(text).split(/\n{2,}/).map((para, i) => <p key={i}>{para.split('\n').map((line, j) => <React.Fragment key={j}>{j > 0 && <br />}{mdInline(line)}</React.Fragment>)}</p>)}</div>;
}

/* ============================ Ziel-Workspaces (Multi-Goal) ============================ */
function freshState() { return { day: todayStr(), battery: 80, sleepQuality: null, blocks: [], streak: 0, lastActiveDay: null, history: [], log: [] }; }
function rollDailyState(s) {
  const t = todayStr();
  if (!s) return freshState();
  if (s.day !== t) {
    const prevFocus = (s.blocks || []).filter(b => b.status === 'done').reduce((a, b) => a + (b.actual || b.minutes), 0);
    const ratings = (s.blocks || []).filter(b => b.focusRating).map(b => b.focusRating);
    const avg = ratings.length ? ratings.reduce((a, c) => a + c, 0) / ratings.length : 0;
    const history = [...(s.history || []), { date: s.day, focusMinutes: prevFocus, avgRating: +avg.toFixed(1), distractions: (s.blocks || []).reduce((a, b) => a + (b.distractions ? b.distractions.length : 0), 0), batteryEnd: s.battery }].slice(-30);
    return { day: t, battery: computeBatteryStart(null, s.battery), sleepQuality: null, blocks: [], streak: s.streak || 0, lastActiveDay: s.lastActiveDay, history, log: s.log || [] };
  }
  return { ...s, log: s.log || [] };
}
// Lädt alle Ziele; migriert alte Einzel-Ziel-Daten automatisch in ein Ziel.
function loadGoals() {
  const g = LS.get('drw_goals', null);
  if (g && Array.isArray(g)) return g.map(x => ({ ...x, state: rollDailyState(x.state) }));
  const p = LS.get('drw_profile', null);
  if (p) return [{ id: uid(), profile: p, coach: LS.get('drw_coach', null), state: rollDailyState(LS.get('drw_state', null)), assistant: LS.get('drw_assistant', []), status: 'active', createdAt: new Date().toISOString() }];
  return [];
}
// Belohnungen beim Zielerreichen (steigern sich mit der Anzahl erreichter Ziele)
const REWARDS = [
  { emoji: '🌱', title: 'Erster Meilenstein', msg: 'Dein erstes Ziel ist erreicht — der schwerste Schritt ist getan!' },
  { emoji: '🔥', title: 'Auf der Jagd', msg: 'Zwei Ziele erreicht. Du baust echtes Momentum auf.' },
  { emoji: '⚡', title: 'Unaufhaltsam', msg: 'Drei Ziele! Rex ist beeindruckt.' },
  { emoji: '🏆', title: 'Zielcrusher', msg: 'Vier Ziele erreicht — das ist Champion-Niveau.' },
  { emoji: '🦖', title: 'Apex Predator', msg: 'Fünf+ Ziele. Du bist an der Spitze der Nahrungskette.' },
];
const pickReward = n => REWARDS[Math.min(n, REWARDS.length - 1)];

/* ============================ Root App ============================ */
function App() {
  const [goals, setGoals] = useState(loadGoals);
  const [activeGoalId, setActiveGoalId] = useState(() => LS.get('drw_activeGoalId', null));
  const [creatingGoal, setCreatingGoal] = useState(false);
  const [showCompleted, setShowCompleted] = useState(false);
  const [rewardModal, setRewardModal] = useState(null);
  const [sub, setSub] = useState(() => LS.get('drw_sub', null));
  const [authEmail, setAuthEmail] = useState(() => LS.get('drw_authEmail', null));
  const [authName, setAuthName] = useState(() => LS.get('drw_authName', ''));
  const [view, setView] = useState('dashboard');
  const [activeMethodId, setActiveMethodId] = useState(null);
  const [overlay, setOverlay] = useState(null);
  const [activeBlock, setActiveBlock] = useState(null);
  const [lastSession, setLastSession] = useState(null);
  const [showPaywall, setShowPaywall] = useState(false);
  const subscribe = plan => { setSub(s => ({ ...(s || {}), status: 'active', plan, trialStart: (s && s.trialStart) || new Date().toISOString(), activatedAt: new Date().toISOString() })); setShowPaywall(false); };

  useEffect(() => LS.set('drw_goals', goals), [goals]);
  useEffect(() => LS.set('drw_activeGoalId', activeGoalId), [activeGoalId]);
  useEffect(() => LS.set('drw_sub', sub), [sub]);
  useEffect(() => LS.set('drw_authEmail', authEmail), [authEmail]);
  useEffect(() => LS.set('drw_authName', authName), [authName]);

  const activeList = goals.filter(g => g.status !== 'done');
  const doneList = goals.filter(g => g.status === 'done');
  let active = goals.find(g => g.id === activeGoalId && g.status !== 'done');
  if (!active) active = activeList[0] || null;

  // Aktives Ziel abgeleitet → Kinder-Komponenten bleiben unverändert
  const profile = active ? active.profile : null;
  const coach = active ? active.coach : null;
  const state = active ? active.state : null;
  const assistant = active ? active.assistant : [];

  const setGoalField = (id, key, up) => setGoals(gs => gs.map(g => g.id === id ? { ...g, [key]: (typeof up === 'function' ? up(g[key]) : up) } : g));
  const setProfile = up => active && setGoalField(active.id, 'profile', up);
  const setCoach = up => active && setGoalField(active.id, 'coach', up);
  const setState = up => active && setGoalField(active.id, 'state', up);
  const setAssistant = up => active && setGoalField(active.id, 'assistant', up);

  async function generateMethodsFor(goalId, p) {
    setGoalField(goalId, 'coach', c => ({ ...(c || {}), loading: true }));
    const res = await askCoach('methods', { name: p.name, goal: p.goal, stoerfaktor: p.stoerfaktor, hindernis: p.hindernis });
    setGoalField(goalId, 'coach', { intro: res.intro || '', methods: (res.methods || []).map(m => ({ ...m, id: uid() })), blockerHelp: res.blockerHelp || '', approaches: {}, threads: {}, captures: {}, source: res.source, loading: false });
  }
  const generateMethods = p => active && generateMethodsFor(active.id, p);

  // Methoden automatisch generieren, wenn ein Ziel (neu/gewechselt) noch keine hat
  useEffect(() => {
    if (active && active.profile && (!active.coach || !active.coach.methods) && !(active.coach && active.coach.loading)) generateMethodsFor(active.id, active.profile);
  }, [active && active.id]);

  function createGoal(p, makeActive = true) {
    const id = uid();
    const withName = { ...p, name: p.name || authName || '' };
    const g = { id, profile: withName, coach: null, state: freshState(), assistant: [], status: 'active', createdAt: new Date().toISOString() };
    setGoals(gs => [...gs, g]);
    if (makeActive) { setActiveGoalId(id); setView('dashboard'); }
    setCreatingGoal(false);
    generateMethodsFor(id, withName);
  }
  function completeGoal(id) {
    const g = goals.find(x => x.id === id); if (!g) return;
    const reward = pickReward(doneList.length);
    setGoals(gs => gs.map(x => x.id === id ? { ...x, status: 'done', doneAt: new Date().toISOString(), reward } : x));
    const nextActive = goals.find(x => x.status !== 'done' && x.id !== id);
    setActiveGoalId(nextActive ? nextActive.id : null);
    setView('dashboard');
    setRewardModal({ goal: g, reward });
  }
  function reopenGoal(id) { setGoals(gs => gs.map(x => x.id === id ? { ...x, status: 'active', doneAt: null } : x)); setActiveGoalId(id); setShowCompleted(false); setView('dashboard'); }

  // ---- Gate-Reihenfolge ----
  if (goals.length === 0) return <Onboarding onDone={p => createGoal(p, true)} />;
  if (!authEmail) return <Auth profile={goals[0].profile} onAuthed={(email, name) => { setAuthEmail(email); setAuthName(name || ''); if (name) setGoals(gs => gs.map(g => ({ ...g, profile: { ...g.profile, name } }))); }} />;
  if (!sub || sub.status === 'none') return <TrialStart profile={goals[0].profile} account={authEmail} onStart={email => setSub({ status: 'trial', trialStart: new Date().toISOString(), email: email || authEmail || null, plan: null })} />;
  if (creatingGoal) return <Onboarding isNew name={authName} onCancel={activeList.length ? () => setCreatingGoal(false) : null} onDone={p => createGoal(p, true)} />;
  if (!active) return (<>
    {rewardModal && <RewardModal data={rewardModal} name={authName} onClose={() => setRewardModal(null)} />}
    <GoalsHub doneList={doneList} name={authName} onNew={() => setCreatingGoal(true)} onReopen={reopenGoal} />
  </>);

  const patch = up => setState(s => ({ ...s, ...up }));
  const startBlock = b => { setActiveBlock(b); setOverlay('session'); };
  const finishBlock = (block, result) => {
    const logId = uid();
    setState(s => {
      const blocks = s.blocks.map(b => b.id === block.id ? { ...b, status: 'done', actual: result.actual, focusRating: result.rating, distractions: result.distractions } : b);
      const drain = clamp(Math.round(result.actual / 3) + result.distractions.length * 2, 4, 40);
      const battery = clamp(s.battery - drain, 0, 100);
      const doneToday = blocks.filter(b => b.status === 'done').length;
      const streak = s.lastActiveDay === todayStr() ? s.streak : (doneToday >= 1 ? (s.streak || 0) + 1 : s.streak);
      const entry = { id: logId, title: block.title, type: block.type || 'deep', planned: block.minutes, actual: result.actual, distractions: result.distractions || [], doneAt: new Date().toISOString(), rating: 0, notes: '' };
      const log = [entry, ...(s.log || [])].slice(0, 200);
      return { ...s, blocks, battery, streak, lastActiveDay: todayStr(), log };
    });
    setLastSession({ block, result, logId }); setOverlay('debrief');
  };
  const updateLog = (id, up) => setState(s => ({ ...s, log: (s.log || []).map(e => e.id === id ? { ...e, ...up } : e) }));
  const skipBlock = block => setState(s => ({ ...s, blocks: s.blocks.map(b => b.id === block.id ? { ...b, status: 'skipped' } : b) }));

  const activeMethod = coach && coach.methods ? coach.methods.find(m => m.id === activeMethodId) : null;

  if (overlay === 'session' && activeBlock) return <Session block={activeBlock} battery={state.battery} profile={profile} onFinish={finishBlock} onRecharge={a => patch({ battery: clamp(state.battery + a, 0, 100) })} onExit={() => setOverlay(null)} />;
  if (overlay === 'debrief' && lastSession) return <Debrief session={lastSession} profile={profile} state={state} onDone={() => setOverlay(null)} onRate={r => updateLog(lastSession.logId, { rating: r })} />;

  const nav = (v) => { setView(v); };
  const switchGoal = id => { setActiveGoalId(id); setView('dashboard'); setActiveMethodId(null); };

  return (
    <div className="min-h-screen ambient lg:flex">
      {/* Sidebar (Desktop) */}
      <aside className="hidden lg:flex lg:flex-col w-[340px] shrink-0 h-screen sticky top-0 border-r border-white/10 bg-black/30 backdrop-blur">
        <Brand />
        <NavLinks view={view} nav={nav} />
        <div className="flex-1 min-h-0 border-t border-white/10">
          <Assistant profile={profile} coach={coach} state={state} messages={assistant} setMessages={setAssistant} />
        </div>
      </aside>

      {showPaywall && <Paywall sub={sub} onSubscribe={subscribe} onClose={() => setShowPaywall(false)} />}
      {rewardModal && <RewardModal data={rewardModal} name={authName} onClose={() => setRewardModal(null)} />}
      {showCompleted && <GoalsHub overlay doneList={doneList} name={authName} onNew={() => { setShowCompleted(false); setCreatingGoal(true); }} onReopen={reopenGoal} onClose={() => setShowCompleted(false)} />}

      {/* Main */}
      <main className="flex-1 min-w-0 pb-24 lg:pb-8">
        {/* Chrome-artige Ziel-Tabs oben */}
        <GoalTabs goals={activeList} activeId={active.id} onSwitch={switchGoal} onNew={() => setCreatingGoal(true)} doneCount={doneList.length} onShowCompleted={() => setShowCompleted(true)} />
        <TrialBanner sub={sub} onManage={() => nav('account')} onUpgrade={() => setShowPaywall(true)} />
        {view === 'dashboard' && <Dashboard profile={profile} coach={coach} state={state} onOpenMethod={id => { setActiveMethodId(id); setView('method'); }} onRegenerate={() => generateMethods(profile)} onComplete={() => completeGoal(active.id)} onReset={() => { ['drw_goals','drw_activeGoalId','drw_profile','drw_coach','drw_assistant','drw_state','drw_sub','drw_authEmail','drw_authName'].forEach(k=>LS.set(k,null)); location.reload(); }} nav={nav} />}
        {view === 'method' && activeMethod && <MethodDetail method={activeMethod} profile={profile} coach={coach} setCoach={setCoach} onBack={() => setView('dashboard')} />}
        {view === 'focus' && <Focus profile={profile} state={state} patch={patch} onStart={startBlock} onSkip={skipBlock} updateLog={updateLog} />}
        {view === 'insights' && <Insights state={state} />}
        {view === 'account' && <AccountScreen sub={sub} setSub={setSub} account={authEmail} onLogout={() => { setAuthEmail(null); nav('dashboard'); }} onBack={() => nav('dashboard')} />}
        {view === 'assistant' && <div className="lg:hidden h-[calc(100vh-6rem)]"><Assistant profile={profile} coach={coach} state={state} messages={assistant} setMessages={setAssistant} /></div>}
      </main>

      <BottomNav view={view} nav={nav} />
    </div>
  );
}

/* ============================ Ziel-Tabs (Chrome-artig) ============================ */
const goalIcon = goal => { const d = goalDomain(goal); return { fitness: '💪', business: '🚀', learning: '📚', health: '🧘', general: '🎯' }[d] || '🎯'; };
const shortGoal = g => { const s = String(g || 'Ziel').trim(); return s.length > 20 ? s.slice(0, 20) + '…' : s; };
function GoalTabs({ goals, activeId, onSwitch, onNew, doneCount, onShowCompleted }) {
  return (
    <div className="sticky top-0 z-40 flex items-stretch gap-1 px-2 pt-2 bg-black/60 backdrop-blur border-b border-white/10 overflow-x-auto">
      {goals.map(g => {
        const on = g.id === activeId;
        return (
          <button key={g.id} onClick={() => onSwitch(g.id)} title={g.profile.goal}
            className={'shrink-0 flex items-center gap-2 px-3.5 py-2 rounded-t-xl text-sm border-b-2 transition max-w-[220px] ' + (on ? 'bg-white/10 border-emerald-400 text-white font-semibold' : 'bg-white/[0.03] border-transparent text-zinc-400 hover:bg-white/5')}>
            <span>{goalIcon(g.profile.goal)}</span><span className="truncate">{shortGoal(g.profile.goal)}</span>
          </button>
        );
      })}
      <button onClick={onNew} title="Neues Ziel" className="shrink-0 w-9 my-1 rounded-lg bg-white/5 border border-white/10 hover:border-emerald-400/50 grid place-items-center text-emerald-300 text-lg">＋</button>
      <div className="flex-1" />
      {doneCount > 0 && <button onClick={onShowCompleted} title="Erreichte Ziele" className="shrink-0 my-1 px-3 rounded-lg bg-white/5 border border-white/10 hover:border-amber-400/40 text-sm text-amber-200 flex items-center gap-1">🏆 {doneCount}</button>}
    </div>
  );
}

/* ============================ Reward beim Zielerreichen ============================ */

}

/* ============================ Erreichte Ziele (Hub) ============================ */

  const inner = (
    <div className="w-full max-w-lg glass rounded-3xl p-7 animate-fadeUp">
      {onClose && <button onClick={onClose} aria-label="Schließen" className="absolute top-4 right-4 w-9 h-9 rounded-full bg-white/5 border border-white/10 hover:border-white/30 grid place-items-center text-lg text-zinc-300">✕</button>}
      <div className="mb-3"><Rex size={44} bob /></div>
      <h1 className="text-2xl font-extrabold mb-1">🏆 Erreichte Ziele</h1>
      <p className="text-zinc-400 text-sm mb-5">{name ? name + ', deine' : 'Deine'} abgehakten Ziele — Beweis, dass du lieferst.</p>
      {doneList.length === 0 ? (
        <p className="text-sm text-zinc-500 mb-5">Noch keine erreichten Ziele. Hak dein erstes Ziel im Dashboard mit „Ziel erreicht" ab.</p>
      ) : (
        <div className="space-y-2.5 mb-5">
          {doneList.map(g => (
            <div key={g.id} className="glass rounded-2xl p-4 flex items-center gap-3">
              <div className="text-2xl">{g.reward ? g.reward.emoji : '✅'}</div>
              <div className="flex-1 min-w-0">
                <div className="font-semibold truncate flex items-center gap-2"><span className="text-emerald-400">✓</span>{g.profile.goal}</div>
                <div className="text-xs text-zinc-500">{g.reward ? g.reward.title + ' · ' : ''}{g.doneAt ? new Date(g.doneAt).toLocaleDateString('de-DE') : ''}</div>
              </div>
              {onReopen && <button onClick={() => onReopen(g.id)} className="shrink-0 text-xs text-zinc-400 hover:text-white underline">wieder öffnen</button>}
            </div>
          ))}
        </div>
      )}
      <button onClick={onNew} className="w-full btn-primary py-3.5 rounded-2xl font-semibold text-white">＋ Neues Ziel starten</button>
    </div>
  );
  if (overlay) return <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-5" onClick={onClose}><div className="relative w-full max-w-lg" onClick={e => e.stopPropagation()}>{inner}</div></div>;
  return <div className="min-h-screen ambient flex items-center justify-center p-5"><div className="relative w-full max-w-lg">{inner}</div></div>;
}

/* ============================ Onboarding ============================ */
function Onboarding({ onDone, isNew, name, onCancel }) {
  const [step, setStep] = useState(0);
  const [stoerfaktor, setStoer] = useState('');
  const [goal, setGoal] = useState('');
  const [hindernis, setHindernis] = useState('');
  const [chronotype, setChrono] = useState('Morgen');
  const [baselineMinutes, setBaseline] = useState(25);

  const steps = [
    { emoji: '🎯', title: isNew ? 'Neues Ziel starten' : (name ? `Willkommen, ${name}!` : 'Willkommen bei DoRealWork'), sub: isNew ? 'Jedes Ziel bekommt seinen eigenen Bereich (Tab) mit eigenem Coaching. Los geht’s mit ein paar Fragen.' : 'Sag mir dein Ziel — ich zeige dir die schnellsten Wege dorthin und coache dich in jeder Disziplin.', body: <p className="text-zinc-400 text-sm">In unter einer Minute kennt dich dein Coach. Danach bekommst du Methoden, Schritt-für-Schritt-Coaching und einen KI-Assistenten, der immer für dich da ist.</p>, valid: true, next: "Los geht's" },
    { emoji: '📵', title: 'Was stört dich am meisten?', sub: 'Dein größter Störfaktor bei der Arbeit — den greifen wir gezielt an.', body: <input autoFocus value={stoerfaktor} onChange={e => setStoer(e.target.value)} placeholder="z. B. Ich spiele zu viel am Handy" className="w-full rounded-xl bg-white/5 border border-white/10 px-4 py-3 outline-none focus:border-emerald-400/60" />, valid: stoerfaktor.trim().length > 1 },
    { emoji: '🎯', title: 'Was ist dein Ziel?', sub: 'Je konkreter, desto besser die Methoden.', body: <input autoFocus value={goal} onChange={e => setGoal(e.target.value)} placeholder="z. B. Einen besseren Körper / Ein Startup gründen" className="w-full rounded-xl bg-white/5 border border-white/10 px-4 py-3 outline-none focus:border-emerald-400/60" />, valid: goal.trim().length > 1 },
    { emoji: '🧱', title: 'Was hindert dich, dein Ziel zu erreichen?', sub: 'Ich gebe dir gleich konkrete Wege, das zu lösen.', body: <input autoFocus value={hindernis} onChange={e => setHindernis(e.target.value)} placeholder="z. B. Keine Zeit / weiß nicht wo anfangen / keine Motivation" className="w-full rounded-xl bg-white/5 border border-white/10 px-4 py-3 outline-none focus:border-emerald-400/60" />, valid: hindernis.trim().length > 1 },
    { emoji: '⚡', title: 'Wann ist deine Energie am höchsten?', sub: 'Dann legen wir deine härtesten Aufgaben hin.', body: <div className="grid grid-cols-2 gap-3">{['Morgen', 'Mittag', 'Nachmittag', 'Abend'].map(o => <button key={o} onClick={() => setChrono(o)} className={'rounded-xl px-4 py-3 border transition ' + (chronotype === o ? 'btn-primary border-transparent text-white' : 'bg-white/5 border-white/10 hover:border-white/25')}>{o}</button>)}</div>, valid: true },
    { emoji: '⏳', title: 'Wie lange kannst du aktuell am Stück fokussieren?', sub: 'Ehrlich — wir bauen es von hier aus aus.', body: <div><div className="text-center text-5xl font-black grad-text mb-4">{baselineMinutes}<span className="text-2xl text-zinc-500 font-bold"> Min</span></div><input type="range" min="10" max="90" step="5" value={baselineMinutes} onChange={e => setBaseline(+e.target.value)} className="w-full accent-emerald-500" /></div>, valid: true },
  ];
  const cur = steps[step]; const last = step === steps.length - 1;
  return (
    <div className="min-h-screen ambient flex items-center justify-center p-5">
      <div className="w-full max-w-md glass rounded-3xl p-7 animate-fadeUp">
        <div className="flex gap-1.5 mb-6">{steps.map((_, i) => <div key={i} className={'h-1 flex-1 rounded-full ' + (i <= step ? 'bg-emerald-500' : 'bg-white/10')} />)}</div>
        <div className="text-4xl mb-3">{cur.emoji}</div>
        <h1 className="text-2xl font-extrabold mb-1">{cur.title}</h1>
        <p className="text-zinc-400 text-sm mb-5">{cur.sub}</p>
        <div className="mb-6">{cur.body}</div>
        <div className="flex gap-3">
          {step > 0 && <button onClick={() => setStep(step - 1)} className="px-4 py-3 rounded-xl bg-white/5 border border-white/10 hover:border-white/25 text-sm">Zurück</button>}
          {step === 0 && onCancel && <button onClick={onCancel} className="px-4 py-3 rounded-xl bg-white/5 border border-white/10 hover:border-white/25 text-sm">Abbrechen</button>}
          <button disabled={!cur.valid} onClick={() => last ? onDone({ stoerfaktor, goal, hindernis, chronotype, baselineMinutes, name: name || undefined, onboarded: true }) : setStep(step + 1)} className={'flex-1 px-4 py-3 rounded-xl font-semibold text-white transition ' + (cur.valid ? 'btn-primary' : 'bg-white/5 text-zinc-500 cursor-not-allowed')}>{last ? (isNew ? 'Ziel erstellen →' : 'Coach aktivieren →') : (cur.next || 'Weiter')}</button>
        </div>
      </div>
    </div>
  );
}

function SourceBadge({ source }) {

function Spinner() { return <span className="inline-block w-4 h-4 border-2 border-white/20 border-t-emerald-400 rounded-full animate-spinSlow" />; }

/* ============================ Method Detail (Coaching) ============================ */
function MethodDetail({ method, profile, coach, setCoach, onBack }) {
  const approach = (coach.approaches || {})[method.id];
  const thread = (coach.threads || {})[method.id] || [];
  const captures = (coach.captures || {})[method.id] || [];
  const [loadingApproach, setLoadingApproach] = useState(false);

  useEffect(() => {
    if (!approach && !loadingApproach) {
      setLoadingApproach(true);
      askCoach('approach', { name: profile.name, goal: profile.goal, stoerfaktor: profile.stoerfaktor, hindernis: profile.hindernis, method: method.title }).then(res => {
        setCoach(c => ({ ...c, approaches: { ...(c.approaches || {}), [method.id]: { steps: res.steps || [], firstQuestions: res.firstQuestions || [], source: res.source } } }));
        setLoadingApproach(false);
      });
    }
  }, [method.id]);

  const setThread = updater => setCoach(c => ({ ...c, threads: { ...(c.threads || {}), [method.id]: typeof updater === 'function' ? updater((c.threads || {})[method.id] || []) : updater } }));
  const setCaptures = updater => setCoach(c => ({ ...c, captures: { ...(c.captures || {}), [method.id]: typeof updater === 'function' ? updater((c.captures || {})[method.id] || []) : updater } }));

  return (
    <div className="max-w-3xl mx-auto px-5 pt-8">
      <button onClick={onBack} className="text-sm text-zinc-400 hover:text-white mb-4">← Zurück zu den Methoden</button>
      <div className="flex items-center gap-3 mb-1"><span className="text-3xl">{method.icon}</span><h1 className="text-2xl font-extrabold">{method.title}</h1></div>
      <p className="text-zinc-400 text-sm mb-6">{method.summary}</p>

      {/* Herangehensweise */}
      <div className="glass rounded-2xl p-5 mb-6">
        <h2 className="font-bold mb-3">🧭 So gehst du es am besten an</h2>
        {loadingApproach || !approach ? <div className="text-sm text-zinc-400 flex items-center gap-2"><Spinner /> Coach erstellt deinen Fahrplan…</div> : (
          <ol className="space-y-3">
            {(approach.steps || []).map((s, i) => (
              <li key={i} className="flex gap-3"><div className="w-6 h-6 rounded-full btn-primary grid place-items-center text-xs font-bold shrink-0">{i + 1}</div><div><div className="font-semibold text-sm">{s.title}</div><div className="text-sm text-zinc-400">{s.detail}</div></div></li>
            ))}
          </ol>
        )}
      </div>

      {/* Kamera / Foto-Analyse */}
      <CameraCoach method={method} profile={profile} captures={captures} setCaptures={setCaptures} />

      {/* Coaching-Chat zu dieser Methode */}
      <div className="glass rounded-2xl p-5 mb-6">
        <h2 className="font-bold mb-1">💬 Coaching zu „{method.title}"</h2>
        <p className="text-xs text-zinc-500 mb-3">Beantworte die Fragen des Coaches oder frag alles zu dieser Methode.</p>
        <ThreadChat profile={profile} method={method} messages={thread} setMessages={setThread} suggestions={approach && approach.firstQuestions} />
      </div>
    </div>
  );
}

function CameraCoach({ method, profile, captures, setCaptures }) {
  const inputRef = useRef();
  const [busy, setBusy] = useState(false);
  const isFitness = goalDomain(profile.goal) === 'fitness';

  async function onFile(e) {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(file); });
    const m = /^data:(.+?);base64,(.*)$/.exec(dataUrl); if (!m) return;
    setBusy(true);
    const res = await askCoach('formcheck', { goal: profile.goal, method: method.title, note: isFitness ? 'Übungs-Ausführung prüfen (Form-Check)' : 'Foto zum Ziel analysieren', imageBase64: m[2], mediaType: m[1] });
    setCaptures(prev => [{ img: dataUrl, feedback: res.text || '', ts: Date.now(), source: res.source }, ...prev]);
    setBusy(false); e.target.value = '';
  }

  return (
    <div className="glass rounded-2xl p-5 mb-6">
      <h2 className="font-bold mb-1">📸 {isFitness ? 'Form-Check per Kamera' : 'Foto-Analyse'}</h2>
      <p className="text-xs text-zinc-500 mb-3">{isFitness ? 'Nimm ein Foto deiner Übungs-Position auf — der Coach sagt dir, was du besser machen kannst.' : 'Lade ein Foto hoch (z. B. deine Mahlzeit) — der Coach analysiert es.'}</p>
      <input ref={inputRef} type="file" accept="image/*" capture="environment" onChange={onFile} className="hidden" />
      <button onClick={() => inputRef.current && inputRef.current.click()} disabled={busy} className={'w-full py-3 rounded-xl font-semibold text-white ' + (busy ? 'bg-white/5 text-zinc-500' : 'btn-primary')}>{busy ? <span className="flex items-center justify-center gap-2"><Spinner /> Analysiere…</span> : '📷 Foto aufnehmen / hochladen'}</button>
      <div className="space-y-3 mt-4">
        {captures.map((c, i) => (
          <div key={i} className="flex gap-3 animate-fadeUp">
            <img src={c.img} alt="" className="w-20 h-20 rounded-xl object-cover border border-white/10" />
            <div className="flex-1 min-w-0"><ChatText text={c.feedback} />{c.source === 'local' && <div className="text-[10px] text-zinc-500 mt-1">Offline — Live-KI für echte Bild-Analyse nötig</div>}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================ Chat components ============================ */
function ThreadChat({ profile, method, messages, setMessages, suggestions }) {
  const [input, setInput] = useState('');
  const [busy, setBusy] = useState(false);
  const scrollRef = useRef();
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, busy]);

  async function send(text) {
    const msg = (text != null ? text : input).trim(); if (!msg || busy) return;
    const next = [...messages, { role: 'user', content: msg }];
    setMessages(next); setInput(''); setBusy(true);
    const res = await askCoach('chat', { name: profile.name, goal: profile.goal, stoerfaktor: profile.stoerfaktor, hindernis: profile.hindernis, method: method ? method.title : null, messages: next });
    setMessages(m => [...m, { role: 'assistant', content: res.text || '(keine Antwort)', source: res.source }]);
    setBusy(false);
  }

  return (
    <div>
      <div ref={scrollRef} className="chat-scroll max-h-72 overflow-y-auto space-y-3 mb-3">
        {messages.length === 0 && suggestions && suggestions.length > 0 && (
          <div className="space-y-2">
            <div className="text-xs text-zinc-500">Der Coach fragt:</div>
            {suggestions.map((q, i) => <button key={i} onClick={() => send(q === true ? '' : q)} className="block w-full text-left text-sm glass rounded-xl px-3 py-2 hover:border-emerald-400/40 text-zinc-200">{q}</button>)}
          </div>
        )}
        {messages.map((m, i) => <Bubble key={i} m={m} />)}
        {busy && <div className="text-zinc-500 text-sm flex items-center gap-2"><Spinner /> Coach denkt nach…</div>}
      </div>
      <ChatInput input={input} setInput={setInput} onSend={() => send()} busy={busy} />
    </div>
  );
}

function Assistant({ profile, coach, state, messages, setMessages }) {
  const [input, setInput] = useState('');
  const [busy, setBusy] = useState(false);
  const [attachments, setAttachments] = useState([]);   // { name, kind, mediaType?, data?, text? }
  const [reading, setReading] = useState(false);
  const scrollRef = useRef();
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, busy]);

  const focusSummary = state ? `${state.blocks.filter(b => b.status === 'done').length} Blöcke erledigt, Battery ${state.battery}, Streak ${state.streak}` : '';
  const quick = ['Was ist mein nächster Schritt?', 'Ich hab grad wenig Zeit — was jetzt?', `Wie komme ich schneller zu: ${profile.goal}?`];

  async function onFiles(fileList) {
    const files = Array.from(fileList || []).slice(0, 5); if (!files.length) return;
    setReading(true);
    try { const read = await Promise.all(files.map(readAttachment)); setAttachments(a => [...a, ...read].slice(0, 8)); }
    finally { setReading(false); }
  }

  async function send(text) {
    const msg = (text != null ? text : input).trim();
    const atts = attachments;
    if ((!msg && atts.length === 0) || busy) return;
    // Sichtbare Nachricht (Anhänge nur als Chips – kein base64 in den Verlauf/localStorage)
    const displayMsg = { role: 'user', content: msg || '📎 Materialien gesendet', atts: atts.map(a => ({ name: a.name, kind: a.kind })) };
    const next = [...messages, displayMsg];
    setMessages(next); setInput(''); setAttachments([]); setBusy(true);
    // Text-/PDF-Inhalte in den Prompt einbetten; Bilder gehen als Vision-Anhang mit
    const textParts = atts.filter(a => a.kind === 'text' && a.text).map(a => `\n\n[Angehängte Datei: ${a.name}]\n${a.text}`);
    const aiText = (msg || 'Bitte wirf einen Blick auf die angehängten Materialien und fasse sie klar zusammen (Kernpunkte, Wichtiges zum Lernen).') + textParts.join('');
    const aiMessages = [...messages.map(m => ({ role: m.role, content: m.content })), { role: 'user', content: aiText }];
    const images = atts.filter(a => a.kind === 'image').map(a => ({ mediaType: a.mediaType, data: a.data }));
    const res = await askCoach('chat', { name: profile.name, goal: profile.goal, stoerfaktor: profile.stoerfaktor, hindernis: profile.hindernis, focusSummary, messages: aiMessages, attachments: images });
    setMessages(m => [...m, { role: 'assistant', content: res.text || '(keine Antwort)', source: res.source }]);
    setBusy(false);
  }

  return (
    <div className="flex flex-col h-full">
      <div className="px-4 py-3 flex items-center gap-2 border-b border-white/10">
        <Rex size={26} /><div><div className="font-bold text-sm leading-none">Rex · dein KI-Coach</div><div className="text-[10px] text-zinc-500">immer für dich da</div></div>
        {coach && coach.source === 'local' && <span className="ml-auto"><SourceBadge source="local" /></span>}
      </div>
      <div ref={scrollRef} className="chat-scroll flex-1 min-h-0 overflow-y-auto p-4 space-y-3">
        {messages.length === 0 && (
          <div className="space-y-2">
            <p className="text-sm text-zinc-400">{profile.name ? `Hey ${profile.name}! ` : ''}Frag mich alles zu deinem Ziel — z. B. „Ich bin grad im Gym, was trainiere ich heute?"</p>
            {quick.map((q, i) => <button key={i} onClick={() => send(q)} className="block w-full text-left text-sm glass rounded-xl px-3 py-2 hover:border-emerald-400/40">{q}</button>)}
          </div>
        )}
        {messages.map((m, i) => <Bubble key={i} m={m} />)}
        {busy && <div className="text-zinc-500 text-sm flex items-center gap-2"><Spinner /> denkt nach…</div>}
      </div>
      <div className="p-3 border-t border-white/10"><ChatInput input={input} setInput={setInput} onSend={() => send()} busy={busy} attachments={attachments} onFiles={onFiles} onRemove={i => setAttachments(a => a.filter((_, j) => j !== i))} reading={reading} /></div>
    </div>
  );
}

function AttachChip({ name, kind, onRemove }) {
  return (
    <span className="inline-flex items-center gap-1 max-w-[160px] bg-white/10 border border-white/15 rounded-lg pl-2 pr-1 py-1 text-xs">
      <span>{kind === 'image' ? '🖼️' : '📄'}</span>
      <span className="truncate">{name}</span>
      {onRemove && <button onClick={onRemove} className="ml-0.5 w-4 h-4 grid place-items-center rounded hover:bg-white/20 text-zinc-300">✕</button>}
    </span>
  );
}
function Bubble({ m }) {
  const user = m.role === 'user';
  return (
    <div className={user ? 'flex justify-end' : 'flex justify-start'}>
      <div className={'max-w-[85%] rounded-2xl px-3.5 py-2.5 ' + (user ? 'btn-primary text-white' : 'glass')}>
        {m.atts && m.atts.length > 0 && <div className="flex flex-wrap gap-1.5 mb-2">{m.atts.map((a, i) => <AttachChip key={i} name={a.name} kind={a.kind} />)}</div>}
        {user ? <div className="text-sm whitespace-pre-wrap">{m.content}</div> : <ChatText text={m.content} />}
      </div>
    </div>
