}
function ChatInput({ input, setInput, onSend, busy, attachments = [], onFiles, onRemove, reading }) {
  const fileRef = useRef();
  return (
    <div>
      {(attachments.length > 0 || reading) && (
        <div className="flex flex-wrap gap-1.5 mb-2">
          {attachments.map((a, i) => <AttachChip key={i} name={a.name} kind={a.kind} onRemove={() => onRemove(i)} />)}
          {reading && <span className="inline-flex items-center gap-1 text-xs text-zinc-400"><Spinner /> lese Datei…</span>}
        </div>
      )}
      <div className="flex gap-2 items-center">
        {/* Plus links: Fotos & Dateien vom Gerät anhängen */}
        <input ref={fileRef} type="file" multiple accept="image/*,.pdf,.txt,.md,.csv,.json,.rtf" className="hidden" onChange={e => { onFiles(e.target.files); e.target.value = ''; }} />
        <button onClick={() => fileRef.current && fileRef.current.click()} title="Foto oder Datei anhängen" className="w-10 h-10 shrink-0 rounded-xl bg-white/5 border border-white/10 hover:border-emerald-400/50 grid place-items-center text-lg text-emerald-300">＋</button>
        <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') onSend(); }} placeholder="Nachricht…" className="flex-1 min-w-0 rounded-xl bg-white/5 border border-white/10 px-3 py-2.5 text-sm outline-none focus:border-emerald-400/60" />
        <button onClick={onSend} disabled={busy} className={'px-4 h-10 shrink-0 rounded-xl font-semibold text-white ' + (busy ? 'bg-white/5 text-zinc-500' : 'btn-primary')}>↑</button>
      </div>
    </div>
  );
}

/* ============================ Focus (Planner + Battery) ============================ */
function Focus({ profile, state, patch, onStart, onSkip }) {
  const [tasks, setTasks] = useState('');
  const [loading, setLoading] = useState(false);
  const [coachNote, setCoachNote] = useState('');
  const [aiSource, setAiSource] = useState(null);
  const [customMin, setCustomMin] = useState(profile.baselineMinutes || 25);
  const [customTitle, setCustomTitle] = useState('');
  const [notifyOn, setNotifyOn] = useState(notifyStatus() === 'granted');
  const [overflow, setOverflow] = useState([]);
  const done = state.blocks.filter(b => b.status === 'done');
  const focusToday = done.reduce((a, b) => a + (b.actual || b.minutes), 0);
  const todo = state.blocks.filter(b => b.status === 'todo');

  async function generate() {
    if (!tasks.trim()) return; setLoading(true);
    const res = await askCoach('plan', { name: profile.name, goal: profile.goal, stoerfaktor: profile.stoerfaktor, hindernis: profile.hindernis, chronotype: profile.chronotype, baselineMinutes: profile.baselineMinutes, battery: state.battery, timeOfDay: timeOfDay(), tasks });
    setCoachNote(res.coachNote || ''); setAiSource(res.source);
    setOverflow(res.overflow || []);
    const blocks = (res.blocks || []).map(b => ({ ...b, id: uid(), status: 'todo', distractions: [] }));
    patch({ blocks: [...state.blocks.filter(b => b.status !== 'todo'), ...blocks] });
    setLoading(false); setTasks('');
    notify('🦖 Rex hat deinen Tag geplant', 'Deine Fokus-Blöcke stehen bereit.');
  }

  // Freier Timer: beliebige Länge (auch sehr lang) ODER Stoppuhr (∞, zählt hoch)
  function startTimer(stopwatch) {
    const m = stopwatch ? 0 : clamp(Math.round(customMin) || 25, 1, 600);
    const block = { id: uid(), title: customTitle.trim() || (stopwatch ? 'Freie Session (Stoppuhr)' : 'Freier Fokus'), minutes: m, stopwatch: !!stopwatch, type: 'deep', why: 'Selbst gesetzter Timer', status: 'todo', distractions: [] };
    patch({ blocks: [...state.blocks, block] });
    onStart(block); setCustomTitle('');
  }
  async function toggleNotify() { const ok = await ensureNotify(); setNotifyOn(ok); if (ok) notify('🔔 Erinnerungen an', 'Rex meldet sich, wenn ein Block fertig ist.'); }

  return (
    <div className="max-w-2xl mx-auto px-5 pt-8">
      <div className="flex items-center justify-between mb-5"><div><div className="text-xs uppercase tracking-widest text-emerald-300/80 font-semibold">{timeOfDay()} · {profile.chronotype}-Typ</div><h1 className="text-2xl font-extrabold">Fokus</h1></div><Streak n={state.streak} /></div>
      <BrainBattery battery={state.battery} sleepQuality={state.sleepQuality} onSleep={q => patch({ battery: computeBatteryStart(q, null), sleepQuality: q })} />

      {/* Freier Timer – selbst einstellbar, bis sehr lang, oder Stoppuhr ohne Limit */}
      <div className="glass rounded-2xl p-4 mt-5">
        <div className="flex items-center gap-2 mb-3"><span className="text-lg">⏱️</span><h2 className="font-bold">Freier Timer</h2><span className="text-xs text-zinc-500">— stell ihn selbst ein</span></div>
        <input value={customTitle} onChange={e => setCustomTitle(e.target.value)} placeholder="Wofür? z. B. Gym Pull, Lernen, Deep Work" className="w-full rounded-xl bg-white/5 border border-white/10 px-4 py-2.5 text-sm outline-none focus:border-emerald-400/60 mb-3" />
        <div className="flex flex-wrap gap-2 mb-3">
          {[15, 25, 45, 55, 60, 90, 120].map(m => <button key={m} onClick={() => setCustomMin(m)} className={'px-3 py-1.5 rounded-lg text-sm border transition ' + (customMin === m ? 'btn-primary border-transparent text-white' : 'bg-white/5 border-white/10 hover:border-white/25')}>{m}′</button>)}
          <div className="flex items-center gap-1 ml-auto">
            <input type="number" min="1" max="600" value={customMin} onChange={e => setCustomMin(+e.target.value)} className="w-20 rounded-lg bg-white/5 border border-white/10 px-3 py-1.5 text-sm text-center outline-none focus:border-emerald-400/60" />
            <span className="text-sm text-zinc-500">Min</span>
          </div>
        </div>
        <div className="flex gap-2">
          <button onClick={() => startTimer(false)} className="flex-1 btn-primary py-2.5 rounded-xl font-semibold text-white text-sm">🔒 {clamp(Math.round(customMin) || 25, 1, 600)} Min starten</button>
          <button onClick={() => startTimer(true)} className="px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 hover:border-emerald-400/40 text-sm" title="Stoppuhr ohne Limit">∞ Stoppuhr</button>
        </div>
      </div>

      {/* Werkzeuge: Kalender-Export + Benachrichtigungen */}
      <div className="flex flex-wrap gap-2 mt-3">
        <button onClick={() => downloadICS(state.blocks)} disabled={todo.length === 0} className={'flex-1 py-2.5 rounded-xl border text-sm font-medium transition ' + (todo.length ? 'bg-white/5 border-white/10 hover:border-emerald-400/40' : 'bg-white/5 border-white/10 text-zinc-600')}>📅 In Apple/Google-Kalender (.ics)</button>
        <button onClick={toggleNotify} className={'flex-1 py-2.5 rounded-xl border text-sm font-medium transition ' + (notifyOn ? 'bg-emerald-500/15 border-emerald-400/40 text-emerald-200' : 'bg-white/5 border-white/10 hover:border-emerald-400/40')}>{notifyOn ? '🔔 Erinnerungen an' : '🔕 Erinnerungen aktivieren'}</button>
      </div>

      <div className="mt-5">
        <label className="text-sm font-semibold text-zinc-300">Was steht heute an?</label>
        <p className="text-xs text-zinc-500 mb-2">Wirf alles rein — mit Dauer & Priorität, wenn du magst. Rex baut daraus deinen Plan <b>inklusive Pausen</b>. Wichtiges markierst du mit „!".</p>
        <textarea value={tasks} onChange={e => setTasks(e.target.value)} rows={3} placeholder="z. B. Essay schreiben 90min !, Mathe Kapitel 5 lernen 45min, Mails 20min" className="w-full rounded-2xl bg-white/5 border border-white/10 px-4 py-3 outline-none focus:border-emerald-400/60 resize-none" />
        <button onClick={generate} disabled={loading || !tasks.trim()} className={'w-full mt-2 py-3 rounded-2xl font-semibold text-white transition ' + (loading || !tasks.trim() ? 'bg-white/5 text-zinc-500' : 'btn-primary')}>{loading ? 'Rex denkt nach…' : '⚡ Meinen Tag planen'}</button>
      </div>
      {coachNote && <div className="glass rounded-2xl p-4 mt-4 border-l-2 border-l-emerald-400/70 animate-fadeUp"><div className="flex items-center gap-2 text-xs text-emerald-300/80 mb-1 font-semibold"><span>🦖 Rex</span>{aiSource === 'local' && <span className="text-zinc-500 font-normal">(Offline)</span>}</div><p className="text-sm text-zinc-200">{coachNote}</p></div>}
      {overflow.length > 0 && <div className="glass rounded-2xl p-4 mt-3 animate-fadeUp"><div className="text-xs text-lime-300/80 font-semibold mb-2">📅 Für später im Kalender (passt heute nicht sinnvoll rein)</div><div className="space-y-1.5">{overflow.map((o, i) => <div key={i} className="text-sm text-zinc-300 flex items-start gap-2"><span className="text-lime-300">•</span><span><b>{o.title}</b>{o.minutes ? ` · ${o.minutes} Min` : ''}{o.why ? <span className="text-zinc-500"> — {o.why}</span> : ''}</span></div>)}</div><button onClick={() => downloadICS(overflow.map(o => ({ ...o, status: 'todo' })))} className="mt-3 text-sm text-lime-200 hover:text-white font-medium">→ Diese Aufgaben in den Kalender exportieren (.ics)</button></div>}
      {todo.length > 0 && <div className="mt-6"><h2 className="text-sm font-semibold text-zinc-300 mb-3">Heutige Fokus-Blöcke</h2><div className="space-y-3">{todo.map(b => <BlockCard key={b.id} b={b} onStart={() => onStart(b)} onSkip={() => onSkip(b)} />)}</div></div>}

      {/* Journal: erledigte Tasks mit Datum, Uhrzeit, Dauer, Bewertung + eigenen Notizen */}
      {(state.log || []).length > 0 && (
        <div className="mt-7">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-semibold text-zinc-300">📓 Verlauf & Notizen</h2>
            {focusToday > 0 && <span className="text-xs font-semibold text-emerald-400">heute {focusToday} Fokus-Min</span>}
          </div>
          <div className="space-y-2.5">{(state.log || []).map(e => <JournalEntry key={e.id} e={e} updateLog={updateLog} />)}</div>
        </div>
      )}
      {todo.length === 0 && (state.log || []).length === 0 && <div className="text-center text-zinc-500 text-sm mt-10"><div className="text-4xl mb-2 animate-floaty">🎯</div>Plane deinen Tag oder starte einen freien Timer, um deinen ersten Block zu machen.</div>}
    </div>
  );
}

/* Ein erledigter Task im Journal – aufklappbar, mit Notizfeld */
function JournalEntry({ e, updateLog }) {
  const [open, setOpen] = useState(false);
  const [notes, setNotes] = useState(e.notes || '');
  const [saved, setSaved] = useState(false);
  const d = new Date(e.doneAt);
  const dateStr = d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
  const timeStr = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  const meta = TYPE_META[e.type] || TYPE_META.deep;
  function save() { updateLog(e.id, { notes }); setSaved(true); setTimeout(() => setSaved(false), 1500); }
  return (
    <div className="glass rounded-2xl overflow-hidden">
      <button onClick={() => setOpen(o => !o)} className="w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-white/5 transition">
        <span className="text-lg">{meta.icon}</span>
        <div className="flex-1 min-w-0">
          <div className="text-sm font-medium truncate">{e.title}</div>
          <div className="text-[11px] text-zinc-500">{dateStr} · {timeStr} · {e.actual} Min{e.notes ? ' · 📝' : ''}</div>
        </div>
        {e.rating > 0 && <span className="text-amber-300 text-sm">{'★'.repeat(e.rating)}</span>}
        <span className="text-zinc-600 text-xs">{open ? '▲' : '▼'}</span>
      </button>
      {open && (
        <div className="px-4 pb-4 pt-1 border-t border-white/5">
          <div className="grid grid-cols-2 gap-2 text-xs text-zinc-400 my-3">
            <div>📅 <b className="text-zinc-200">{dateStr}</b> um {timeStr}</div>
            <div>⏱️ <b className="text-zinc-200">{e.actual}</b> von {e.planned} Min</div>
            <div>⭐ Bewertung: <b className="text-zinc-200">{e.rating > 0 ? e.rating + '/5' : '—'}</b></div>
            <div>😵‍💫 Ablenkungen: <b className="text-zinc-200">{(e.distractions || []).length}</b></div>
          </div>
          <label className="text-xs font-semibold text-zinc-300">Deine Notizen</label>
          <textarea value={notes} onChange={ev => setNotes(ev.target.value)} rows={3} placeholder="Was hast du gemacht? Was lief gut/schlecht? Nächstes Mal…" className="w-full mt-1 rounded-xl bg-white/5 border border-white/10 px-3 py-2 text-sm outline-none focus:border-emerald-400/60 resize-none" />
          <div className="flex items-center gap-2 mt-2">
            <button onClick={save} className="btn-primary px-4 py-2 rounded-lg text-sm font-semibold text-white">Notiz speichern</button>
            {saved && <span className="text-xs text-emerald-400">✓ gespeichert</span>}
          </div>
        </div>
      )}
    </div>
  );
}
const TYPE_META = { deep: { icon: '🧠', label: 'Deep Work' }, learning: { icon: '📚', label: 'Lernen' }, creative: { icon: '✨', label: 'Kreativ' }, admin: { icon: '🗂️', label: 'Admin' }, break: { icon: '☕', label: 'Pause' } };
function BlockCard({ b, onStart, onSkip }) {
  const m = TYPE_META[b.type] || TYPE_META.deep;
  // Pausen: als ruhige Erholungs-Zeile darstellen, nicht als „Lock in"-Block
  if (b.type === 'break') {
    return (
      <div className="rounded-2xl px-4 py-3 border border-dashed border-emerald-400/25 bg-emerald-500/5 flex items-center gap-3 animate-fadeUp">
        <div className="text-xl">{m.icon}</div>
        <div className="flex-1 min-w-0"><div className="text-sm font-medium text-emerald-100/90">{b.title}</div><div className="text-xs text-emerald-300/60">{m.label} · {b.minutes} Min</div></div>
        <button onClick={onSkip} className="text-xs text-zinc-500 hover:text-zinc-300">überspringen</button>
      </div>
    );
  }
  return (
    <div className="glass rounded-2xl p-4 animate-fadeUp">
      <div className="flex items-start gap-3"><div className="text-2xl">{m.icon}</div><div className="flex-1 min-w-0"><div className="font-semibold truncate">{b.title}</div><div className="text-xs text-zinc-400 mt-0.5">{m.label} · {b.minutes} Min</div>{b.why && <div className="text-xs text-zinc-500 mt-1 italic">„{b.why}"</div>}</div></div>
      <div className="flex gap-2 mt-3"><button onClick={onStart} className="flex-1 btn-primary py-2.5 rounded-xl font-semibold text-white text-sm">🔒 Lock in</button><button onClick={onSkip} className="px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 hover:border-white/25 text-sm text-zinc-400">Skip</button></div>
    </div>
  );
}
function Streak({ n }) { return <div className="flex items-center gap-1.5 glass rounded-xl px-3 h-10" title="Fokus-Streak"><span className={n > 0 ? '' : 'grayscale opacity-50'}>🔥</span><span className="font-bold">{n}</span></div>; }

function BrainBattery({ battery, sleepQuality, onSleep }) {
  const color = batteryColor(battery); const r = 52, circ = 2 * Math.PI * r;
  return (
    <div className="glass rounded-3xl p-5 flex items-center gap-5">
      <div className="relative w-28 h-28 shrink-0">
        <svg viewBox="0 0 130 130" className="w-full h-full -rotate-90"><circle cx="65" cy="65" r={r} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="10" /><circle cx="65" cy="65" r={r} fill="none" stroke={color} strokeWidth="10" strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={circ * (1 - battery / 100)} style={{ transition: 'stroke-dashoffset .8s ease, stroke .5s' }} /></svg>
        <div className="absolute inset-0 grid place-items-center"><div className="text-center"><div className="text-2xl font-black" style={{ color }}>{battery}</div><div className="text-[10px] uppercase tracking-wider text-zinc-500">Battery</div></div></div>
      </div>
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2"><span className="text-lg">🔋</span><h3 className="font-bold">Brain Battery</h3></div>
        <p className="text-sm mt-0.5" style={{ color }}>{batteryLabel(battery)}</p>
        {sleepQuality == null ? <div className="mt-3"><div className="text-xs text-zinc-400 mb-1.5">Wie hast du geschlafen?</div><div className="flex gap-1.5">{[1, 2, 3, 4, 5].map(q => <button key={q} onClick={() => onSleep(q)} className="w-9 h-9 rounded-lg bg-white/5 border border-white/10 hover:border-emerald-400/60 text-sm">{q}</button>)}</div></div> : <p className="text-xs text-zinc-500 mt-2">Sinkt bei Deep Work, lädt bei Pausen & Schlaf. Kein Wearable nötig.</p>}
      </div>
    </div>
  );
}

/* ============================ Session ============================ */
const RECOVERIES = [
  { icon: '🌬️', t: 'Box-Breathing', d: '4 Sek ein · 4 halten · 4 aus · 4 halten. 4 Runden.', amt: 8 },
  { icon: '🚶', t: 'Kurzer Walk', d: '2 Minuten laufen — am besten raus oder ans Fenster.', amt: 10 },
  { icon: '☀️', t: 'Licht tanken', d: '2 Min Tageslicht / ans Fenster. Blick in die Ferne.', amt: 9 },
  { icon: '💧', t: 'Wasser + Screen-Pause', d: 'Trink ein Glas Wasser, Augen weg vom Bildschirm.', amt: 7 },
];
function Session({ block, battery, profile, onFinish, onRecharge, onExit }) {
  const stopwatch = !!block.stopwatch;              // ∞-Modus: zählt hoch, kein Limit
  const total = stopwatch ? 0 : block.minutes * 60;
  const [left, setLeft] = useState(total);           // Countdown-Rest
  const [up, setUp] = useState(0);                   // hochzählende Sekunden (Stoppuhr)
  const [running, setRunning] = useState(true);
  const [distractions, setDistractions] = useState([]);
  const [phase, setPhase] = useState('focus');
  const [recovery, setRecovery] = useState(null);
  useEffect(() => {
    if (!running || phase !== 'focus') return;
    const id = setInterval(() => {
      if (stopwatch) { setUp(u => u + 1); return; }
      setLeft(l => { if (l <= 1) { clearInterval(id); doComplete(true); return 0; } return l - 1; });
    }, 1000);
    return () => clearInterval(id);
  }, [running, phase]);
  const elapsedMin = () => stopwatch ? Math.max(1, Math.round(up / 60)) : Math.max(1, Math.round((total - left) / 60));
  const logDistraction = () => setDistractions(d => [...d, { at: elapsedMin(), type: profile.stoerfaktor }]);
  function doComplete(natural) {
    const actual = (natural && !stopwatch) ? block.minutes : elapsedMin();
    notify('🦖 Block fertig: ' + block.title, `${actual} Min fokussiert. Kurze Erholung, dann weiter.`);
    setRecovery({ rec: RECOVERIES[Math.floor(Math.random() * RECOVERIES.length)], actual }); setPhase('recovery');
  }
  const secs = stopwatch ? up : left;
  const pct = stopwatch ? 100 : ((total - left) / total) * 100;
  const mm = String(Math.floor(secs / 60)).padStart(2, '0'), ss = String(secs % 60).padStart(2, '0');

  if (phase === 'recovery' && recovery) return (
    <div className="min-h-screen ambient flex items-center justify-center p-6 text-center">
      <div className="max-w-sm w-full animate-fadeUp"><div className="text-6xl mb-4 animate-floaty">{recovery.rec.icon}</div><div className="text-xs uppercase tracking-widest text-emerald-300/80 font-semibold mb-1">Erholung · schützt deine Battery</div><h2 className="text-2xl font-extrabold mb-2">{recovery.rec.t}</h2><p className="text-zinc-400 mb-6">{recovery.rec.d}</p>
      <button onClick={() => { onRecharge(recovery.rec.amt); onFinish(block, { actual: recovery.actual, rating: 0, distractions }); }} className="w-full btn-primary py-3.5 rounded-2xl font-semibold text-white">Erholt — weiter zum Debrief</button>
      <button onClick={() => onFinish(block, { actual: recovery.actual, rating: 0, distractions })} className="w-full mt-2 py-3 text-sm text-zinc-500 hover:text-zinc-300">Überspringen</button></div>
    </div>
  );

  return (
    <div className="min-h-screen ambient flex flex-col">
      <div className="flex items-center justify-between p-5"><button onClick={onExit} className="text-sm text-zinc-500 hover:text-zinc-300">← Beenden</button><div className="text-xs text-zinc-500">Battery {battery}</div></div>
      <div className="flex-1 flex flex-col items-center justify-center px-6 -mt-8">
        <div className="text-xs uppercase tracking-widest text-emerald-300/80 font-semibold mb-2">🔒 Locked in</div>
        <h2 className="text-xl font-bold text-center mb-1 max-w-sm">{block.title}</h2>
        {block.why && <p className="text-xs text-zinc-500 mb-8 text-center max-w-xs">„{block.why}"</p>}
        <div className="relative w-72 h-72 my-2">
          <svg viewBox="0 0 200 200" className="w-full h-full -rotate-90"><circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="6" /><circle cx="100" cy="100" r="88" fill="none" stroke="url(#g)" strokeWidth="6" strokeLinecap="round" strokeDasharray={2 * Math.PI * 88} strokeDashoffset={2 * Math.PI * 88 * (1 - pct / 100)} style={{ transition: 'stroke-dashoffset 1s linear' }} /><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#10b981" /><stop offset="1" stopColor="#4d7c0f" /></linearGradient></defs></svg>
          <div className="absolute inset-0 grid place-items-center"><div className="text-center"><div className="text-6xl font-black tabular-nums">{mm}:{ss}</div><div className="text-xs text-zinc-500 mt-1">{running ? 'in Progress' : 'pausiert'}</div></div></div>
        </div>
        {battery < 35 && <div className="glass rounded-xl px-4 py-2 mt-2 text-xs text-amber-300 border border-amber-400/20">⚠️ Niedrige Battery — Block kurz halten, danach echte Erholung.</div>}
        <div className="flex items-center gap-3 mt-8"><button onClick={() => setRunning(r => !r)} className="w-14 h-14 rounded-full glass grid place-items-center text-xl hover:border-white/30">{running ? '⏸' : '▶'}</button><button onClick={() => doComplete(false)} className="px-6 h-14 rounded-full btn-primary font-semibold text-white">Block beenden</button></div>
        <button onClick={logDistraction} className="mt-6 text-sm text-zinc-500 hover:text-amber-300 transition">😵‍💫 Ich hab mich ablenken lassen {distractions.length > 0 && <span className="text-amber-300 font-semibold">({distractions.length})</span>}</button>
        <p className="text-[11px] text-zinc-600 mt-1 max-w-xs text-center">Ein Tap, wenn du abdriftest — kein Urteil. Der Coach lernt dein Muster.</p>
      </div>
    </div>
  );
}

/* ============================ Debrief ============================ */
function Debrief({ session, profile, state, onDone, onRate }) {
  const { block, result } = session;
  const [rating, setRating] = useState(0);
  const [extra, setExtra] = useState(result.distractions || []);
  const [loading, setLoading] = useState(false);
  const [insight, setInsight] = useState(null);
  const types = ['Handy', 'Social Media', 'Gedanken', 'Menschen', 'Müdigkeit', 'Langeweile'];
  const topDistraction = useMemo(() => { const all = [...(state.blocks || [])].flatMap(b => b.distractions || []).map(d => d.type); const c = {}; all.forEach(t => c[t] = (c[t] || 0) + 1); return Object.entries(c).sort((a, b) => b[1] - a[1])[0]?.[0] || profile.stoerfaktor; }, []);

  function rate(s) { setRating(s); if (onRate) onRate(s); }   // Bewertung sofort ins Journal speichern
  async function analyze() { setLoading(true); if (onRate) onRate(rating); const res = await askCoach('debrief', { planned: block.minutes, actual: result.actual, rating, distractions: extra, topDistraction, history: (state.history || []).slice(-5) }); setInsight(res); setLoading(false); }

  if (insight) return (
    <div className="min-h-screen ambient flex items-center justify-center p-6"><div className="max-w-md w-full glass rounded-3xl p-7 animate-fadeUp">
      <div className="text-4xl mb-3">🧠</div><div className="text-xs uppercase tracking-widest text-emerald-300/80 font-semibold mb-3">Coach-Analyse {insight.source === 'local' && <span className="text-zinc-500">(Offline)</span>}</div>
      <div className="space-y-4"><div><div className="text-xs text-zinc-500 mb-1">Muster erkannt</div><p className="text-zinc-100">{insight.insight}</p></div><div className="glass rounded-2xl p-4 border-l-2 border-l-emerald-400/70"><div className="text-xs text-emerald-300/80 mb-1 font-semibold">✅ Für morgen</div><p className="text-sm text-zinc-100">{insight.adjustment}</p></div>{insight.encouragement && <p className="text-sm text-zinc-400 italic">{insight.encouragement}</p>}</div>
      <button onClick={onDone} className="w-full btn-primary py-3.5 rounded-2xl font-semibold text-white mt-6">Weiter →</button></div></div>
  );

  return (
    <div className="min-h-screen ambient flex items-center justify-center p-6"><div className="max-w-md w-full glass rounded-3xl p-7 animate-fadeUp">
      <div className="text-xs uppercase tracking-widest text-emerald-300/80 font-semibold mb-1">Session-Debrief</div><h2 className="text-2xl font-extrabold mb-1">{block.title}</h2><p className="text-zinc-400 text-sm mb-6">{result.actual} von {block.minutes} Min fokussiert.</p>
      <div className="mb-6"><div className="text-sm font-semibold mb-2">Wie fokussiert warst du?</div><div className="flex gap-2">{[1, 2, 3, 4, 5].map(s => <button key={s} onClick={() => rate(s)} className={'flex-1 h-12 rounded-xl border text-lg transition ' + (rating >= s ? 'bg-amber-400/20 border-amber-400/50 text-amber-300' : 'bg-white/5 border-white/10')}>★</button>)}</div></div>
      <div className="mb-6"><div className="text-sm font-semibold mb-2">Was hat dich rausgezogen? <span className="text-zinc-500 font-normal">(optional)</span></div><div className="flex flex-wrap gap-2">{types.map(d => { const active = extra.some(x => x.type === d); return <button key={d} onClick={() => setExtra(prev => active ? prev.filter(x => x.type !== d) : [...prev, { type: d, at: 0 }])} className={'px-3 py-1.5 rounded-full text-sm border transition ' + (active ? 'bg-emerald-500/25 border-emerald-400/50 text-emerald-200' : 'bg-white/5 border-white/10 text-zinc-400 hover:border-white/25')}>{d}</button>; })}</div></div>
      <button onClick={analyze} disabled={loading || rating === 0} className={'w-full py-3.5 rounded-2xl font-semibold text-white transition ' + (loading || rating === 0 ? 'bg-white/5 text-zinc-500' : 'btn-primary')}>{loading ? 'Coach analysiert…' : '🧠 Analyse & Tipp für morgen'}</button>
    </div></div>
  );
}

/* ============================ Insights ============================ */
function Insights({ state }) {
  const hist = state.history || [];
  const today = { date: todayStr(), focusMinutes: state.blocks.filter(b => b.status === 'done').reduce((a, b) => a + (b.actual || b.minutes), 0) };
  const series = [...hist, today].slice(-10);
  const maxM = Math.max(30, ...series.map(s => s.focusMinutes));
  const totalMin = series.reduce((a, s) => a + s.focusMinutes, 0);
  const distr = {}; [...(state.blocks || [])].flatMap(b => b.distractions || []).forEach(d => distr[d.type] = (distr[d.type] || 0) + 1);
  const topDistr = Object.entries(distr).sort((a, b) => b[1] - a[1]).slice(0, 4);
  return (
    <div className="max-w-2xl mx-auto px-5 pt-8">
      <h1 className="text-2xl font-extrabold mb-6">Dein Fortschritt</h1>
      <div className="grid grid-cols-3 gap-3 mb-6"><Stat label="Streak" value={state.streak} suffix="🔥" /><Stat label="Fokus gesamt" value={totalMin} suffix="min" /><Stat label="Ø / Tag" value={series.length ? Math.round(totalMin / series.length) : 0} suffix="min" /></div>
      <div className="glass rounded-3xl p-5 mb-6"><h3 className="font-bold mb-4">Fokus-Minuten pro Tag</h3><div className="flex items-end gap-2 h-40">{series.map((s, i) => <div key={i} className="flex-1 flex flex-col items-center gap-1"><div className="w-full rounded-t-lg btn-primary" style={{ height: `${(s.focusMinutes / maxM) * 100}%`, minHeight: s.focusMinutes ? '4px' : '0' }} title={`${s.focusMinutes} min`}></div><div className="text-[9px] text-zinc-600">{s.date.slice(5)}</div></div>)}</div><p className="text-xs text-zinc-500 mt-3">Deine Fokus-Kapazität wächst mit jedem Block — Training, kein Tracking.</p></div>
      <div className="glass rounded-3xl p-5"><h3 className="font-bold mb-4">Deine größten Fokus-Leaks</h3>{topDistr.length === 0 ? <p className="text-sm text-zinc-500">Noch keine Ablenkungen erfasst. Logge sie in Sessions.</p> : <div className="space-y-2.5">{topDistr.map(([t, n]) => { const max = topDistr[0][1]; return <div key={t} className="flex items-center gap-3"><div className="w-28 text-sm text-zinc-300 truncate">{t}</div><div className="flex-1 h-3 rounded-full bg-white/5 overflow-hidden"><div className="h-full rounded-full" style={{ width: `${(n / max) * 100}%`, background: 'linear-gradient(90deg,#fbbf24,#f87171)' }}></div></div><div className="text-xs text-zinc-500 w-6 text-right">{n}×</div></div>; })}</div>}</div>
    </div>
  );
}
function Stat({ label, value, suffix }) { return <div className="glass rounded-2xl p-4 text-center"><div className="text-2xl font-black grad-text">{value}<span className="text-sm text-zinc-500 font-bold ml-0.5">{suffix}</span></div><div className="text-[11px] uppercase tracking-wider text-zinc-500 mt-0.5">{label}</div></div>; }

/* ============================ Abo-Screens ============================ */
const TRIAL_BENEFITS = [
  { icon: '🚀', t: 'KI-Methoden zu jedem Ziel', d: 'Die schnellsten Wege — individuell für dich generiert.' },
  { icon: '💬', t: 'Persönlicher KI-Coach', d: 'Immer da: frag alles, bekomm deinen nächsten Schritt.' },
  { icon: '📸', t: 'Foto- & Form-Check', d: 'Übungen & Mahlzeiten per Kamera analysieren lassen.' },
  { icon: '🔒', t: 'Fokus-Sessions + Brain Battery', d: 'Locked in bleiben, ohne auszubrennen.' },
];

function Auth({ profile, onAuthed }) {
  const [mode, setMode] = useState('signup');   // signup | login
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const login = mode === 'login';

  async function submit() {
    setErr('');
    if (!login && name.trim().length < 2) return setErr('Bitte gib deinen Namen ein.');
    if (!validEmail(email)) return setErr('Bitte gib eine gültige E-Mail-Adresse ein.');
    if (pw.length < 6) return setErr('Das Passwort braucht mindestens 6 Zeichen.');
    if (!login && pw !== pw2) return setErr('Die Passwörter stimmen nicht überein.');
    setBusy(true);
    const res = login ? await loginAccount(email, pw) : await createAccount(email, pw, name);
    setBusy(false);
    if (!res.ok) return setErr(res.error);
    onAuthed(res.email, res.name || '');
  }

  return (
    <div className="min-h-screen ambient flex items-center justify-center p-5">
      <div className="w-full max-w-md glass rounded-3xl p-7 animate-fadeUp">
        <div className="mb-3"><Rex size={46} bob /></div>
        <h1 className="text-2xl font-extrabold mb-1">{login ? 'Willkommen zurück' : 'Erstelle deinen Account'}</h1>
        <p className="text-zinc-400 text-sm mb-5">{login ? 'Melde dich an, um mit Rex weiterzumachen.' : <>Dein Ziel <span className="text-zinc-200 font-semibold">„{profile.goal}"</span> ist gespeichert. Sichere deinen Fortschritt mit einem eigenen Konto.</>}</p>

        {!login && (
          <>
            <label className="text-xs font-semibold text-zinc-300">Dein Name</label>
            <input value={name} onChange={e => setName(e.target.value)} type="text" autoComplete="given-name" placeholder="Wie sollen wir dich nennen?"
              className="w-full mt-1 mb-3 rounded-xl bg-white/5 border border-white/10 px-4 py-3 outline-none focus:border-emerald-400/60 text-sm" />
          </>
        )}

        <label className="text-xs font-semibold text-zinc-300">E-Mail</label>
        <input value={email} onChange={e => setEmail(e.target.value)} type="email" autoComplete="email" placeholder="du@beispiel.de"
          className="w-full mt-1 mb-3 rounded-xl bg-white/5 border border-white/10 px-4 py-3 outline-none focus:border-emerald-400/60 text-sm" />

        <label className="text-xs font-semibold text-zinc-300">Passwort</label>
        <input value={pw} onChange={e => setPw(e.target.value)} type="password" autoComplete={login ? 'current-password' : 'new-password'} placeholder="mind. 6 Zeichen"
          className="w-full mt-1 mb-3 rounded-xl bg-white/5 border border-white/10 px-4 py-3 outline-none focus:border-emerald-400/60 text-sm"
          onKeyDown={e => { if (e.key === 'Enter' && login) submit(); }} />

        {!login && (
          <>
            <label className="text-xs font-semibold text-zinc-300">Passwort wiederholen</label>
            <input value={pw2} onChange={e => setPw2(e.target.value)} type="password" autoComplete="new-password" placeholder="Passwort bestätigen"
              className="w-full mt-1 mb-3 rounded-xl bg-white/5 border border-white/10 px-4 py-3 outline-none focus:border-emerald-400/60 text-sm"
              onKeyDown={e => { if (e.key === 'Enter') submit(); }} />
          </>
        )}

        {err && <div className="text-sm text-red-300 bg-red-500/10 border border-red-400/20 rounded-xl px-3 py-2 mb-3">{err}</div>}

        <button onClick={submit} disabled={busy} className={'w-full py-3.5 rounded-2xl font-semibold text-white transition ' + (busy ? 'bg-white/5 text-zinc-500' : 'btn-primary')}>
          {busy ? 'Einen Moment…' : (login ? 'Einloggen →' : 'Konto erstellen →')}
        </button>

        <button onClick={() => { setErr(''); setMode(login ? 'signup' : 'login'); }} className="block mx-auto mt-4 text-sm text-zinc-400 hover:text-white">
          {login ? 'Noch kein Konto? Jetzt erstellen' : 'Schon ein Konto? Einloggen'}
        </button>

        <p className="text-[11px] text-zinc-500 text-center mt-4">🔒 Dein Passwort wird verschlüsselt (gehasht) gespeichert — nie im Klartext. Danach: 7 Tage gratis.</p>
      </div>
    </div>
  );
}

function TrialStart({ profile, account, onStart }) {
  const [email, setEmail] = useState((account && account) || '');
  return (
    <div className="min-h-screen ambient flex items-center justify-center p-5">
      <div className="w-full max-w-md glass rounded-3xl p-7 animate-fadeUp">
        <div className="text-4xl mb-3">🎁</div>
        <h1 className="text-2xl font-extrabold mb-1">{profile.name ? `${profile.name}, teste 7 Tage kostenlos` : '7 Tage kostenlos testen'}</h1>
        <p className="text-zinc-400 text-sm mb-5">Dein Coach Rex für <span className="text-zinc-200 font-semibold">„{profile.goal}"</span> steht bereit. Teste alles 7 Tage gratis.</p>
        <div className="space-y-3 mb-5">
          {TRIAL_BENEFITS.map((b, i) => (
            <div key={i} className="flex gap-3"><span className="text-xl">{b.icon}</span><div><div className="text-sm font-semibold">{b.t}</div><div className="text-xs text-zinc-400">{b.d}</div></div></div>
          ))}
        </div>
        <div className="glass rounded-2xl p-3 mb-4 text-xs text-zinc-300 flex items-center gap-2">
          <span className="text-emerald-400">✓</span> Keine Kreditkarte nötig · danach {PLANS.monthly.price}{PLANS.monthly.per} · jederzeit kündbar
        </div>
        {account && <div className="glass rounded-2xl p-3 mb-3 text-xs text-zinc-400 flex items-center gap-2"><span>👤</span> Angemeldet als <span className="text-zinc-200 font-semibold">{account}</span></div>}
        <button onClick={() => onStart((account || email || '').trim())} className="w-full btn-primary py-3.5 rounded-2xl font-semibold text-white">🎁 7 Tage gratis starten</button>
        <p className="text-[11px] text-zinc-500 text-center mt-3">Ohne Zahlungsdaten. Wir erinnern dich vor Ablauf.</p>
      </div>
    </div>
  );
}

function PlanCards({ plan, setPlan }) {
  return (
    <div className="grid grid-cols-2 gap-3 mb-4">
      {Object.values(PLANS).map(pl => (
        <button key={pl.id} onClick={() => setPlan(pl.id)} className={'text-left rounded-2xl p-4 border transition relative ' + (plan === pl.id ? 'border-emerald-400/70 bg-emerald-500/10' : 'border-white/10 bg-white/5 hover:border-white/25')}>
          {pl.id === 'yearly' && <span className="absolute -top-2 right-3 text-[10px] px-2 py-0.5 rounded-full btn-primary text-white font-semibold">Beliebt</span>}
          <div className="text-sm font-semibold">{pl.label}</div>
          <div className="text-xl font-black mt-1">{pl.price}<span className="text-xs text-zinc-500 font-medium">{pl.per}</span></div>
          <div className="text-[11px] text-zinc-400 mt-1">{pl.note}</div>
        </button>
      ))}
    </div>
  );
}
const DemoPayNote = () => <p className="text-[11px] text-zinc-500 text-center mt-3">🔒 Demo-Modus: In der Live-Version öffnet sich hier der sichere Stripe-Checkout. Es wird jetzt kein Geld abgebucht.</p>;

function Paywall({ sub, onSubscribe, onClose }) {
  const [plan, setPlan] = useState('yearly');
  return (
    <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-5" onClick={onClose}>
      <div className="w-full max-w-md glass rounded-3xl p-7 animate-fadeUp relative" onClick={e => e.stopPropagation()}>
        {/* X zum Schließen – man kommt IMMER wieder raus und nutzt die Gratis-Version weiter */}
        <button onClick={onClose} aria-label="Schließen" className="absolute top-4 right-4 w-9 h-9 rounded-full bg-white/5 border border-white/10 hover:border-white/30 grid place-items-center text-lg text-zinc-300">✕</button>
        <div className="mb-3"><Rex size={48} bob /></div>
        <h1 className="text-2xl font-extrabold mb-1">Rex: Schalte alles frei 🚀</h1>
        <p className="text-zinc-400 text-sm mb-5">Bleib dran an deinem Ziel — hol dir den vollen KI-Coach. Du kannst die App aber auch gratis weiternutzen.</p>
        <PlanCards plan={plan} setPlan={setPlan} />
        <button onClick={() => onSubscribe(plan)} className="w-full btn-primary py-3.5 rounded-2xl font-semibold text-white">Jetzt abonnieren · {PLANS[plan].price}{PLANS[plan].per}</button>
        <DemoPayNote />
        <button onClick={onClose} className="block mx-auto mt-4 text-sm text-zinc-400 hover:text-white">Später – gratis weiter nutzen</button>
      </div>
    </div>
  );
}

function TrialBanner({ sub, onManage, onUpgrade }) {
  const st = subState(sub);
  if (st === 'trial') {
    const d = trialDaysLeft(sub);
    return (
      <div className="sticky top-0 z-30 bg-emerald-600/20 backdrop-blur border-b border-emerald-400/20 px-5 py-2 text-sm flex items-center justify-between">
        <span>🎁 Gratis-Test: noch <b>{d}</b> {d === 1 ? 'Tag' : 'Tage'}</span>
        <button onClick={onManage} className="text-emerald-200 hover:text-white font-semibold">Abo verwalten →</button>
      </div>
    );
  }
  if (st === 'active') {
    return (
      <div className="sticky top-0 z-30 bg-emerald-600/15 backdrop-blur border-b border-emerald-400/20 px-5 py-2 text-sm flex items-center justify-between">
        <span>✓ Abo aktiv{sub.plan && PLANS[sub.plan] ? ` · ${PLANS[sub.plan].label}` : ''}</span>
        <button onClick={onManage} className="text-emerald-200 hover:text-white font-semibold">Verwalten →</button>
      </div>
    );
  }
  // Gratis-Version (Trial vorbei oder gekündigt) – App bleibt nutzbar, sanftes Upgrade-Angebot
  if (st === 'free') {
    return (
      <div className="sticky top-0 z-30 bg-lime-600/15 backdrop-blur border-b border-lime-400/20 px-5 py-2 text-sm flex items-center justify-between">
        <span>🌱 Gratis-Version aktiv</span>
        <button onClick={onUpgrade || onManage} className="text-lime-200 hover:text-white font-semibold">Auf Pro upgraden →</button>
      </div>
    );
  }
  return null;
}

function AccountScreen({ sub, setSub, account, onLogout, onBack }) {
  const st = subState(sub);
  const [plan, setPlan] = useState(sub.plan || 'yearly');
  return (
    <div className="max-w-lg mx-auto px-5 pt-8">
      <button onClick={onBack} className="text-sm text-zinc-400 hover:text-white mb-4">← Zurück</button>
      <h1 className="text-2xl font-extrabold mb-6">Dein Konto</h1>

      <div className="glass rounded-2xl p-5 mb-4 flex items-center justify-between gap-3">
        <div className="min-w-0">
          <div className="text-xs uppercase tracking-widest text-emerald-300/80 font-semibold mb-1">Angemeldet als</div>
          <div className="font-semibold truncate">👤 {account || sub.email || '—'}</div>
        </div>
        {onLogout && <button onClick={onLogout} className="shrink-0 px-4 py-2 rounded-xl bg-white/5 border border-white/10 hover:border-white/25 text-sm text-zinc-300">Abmelden</button>}
      </div>

      <div className="glass rounded-2xl p-5 mb-6">
        <div className="text-xs uppercase tracking-widest text-emerald-300/80 font-semibold mb-1">Abo-Status</div>
        {st === 'trial' && <div className="text-lg font-bold">🎁 Gratis-Test — noch {trialDaysLeft(sub)} Tage</div>}
        {st === 'active' && <div className="text-lg font-bold text-emerald-400">✓ Aktiv{sub.plan && PLANS[sub.plan] ? ` · ${PLANS[sub.plan].label} (${PLANS[sub.plan].price}${PLANS[sub.plan].per})` : ''}</div>}
        {st === 'free' && <div className="text-lg font-bold text-lime-300">🌱 Gratis-Version — voll nutzbar</div>}
      </div>

      {st !== 'active' && (
        <div className="mb-6">
          <h2 className="font-bold mb-3">Plan wählen</h2>
          <PlanCards plan={plan} setPlan={setPlan} />
          <button onClick={() => setSub({ status: 'active', plan, trialStart: sub.trialStart, email: sub.email, activatedAt: new Date().toISOString() })} className="w-full btn-primary py-3.5 rounded-2xl font-semibold text-white">Jetzt abonnieren · {PLANS[plan].price}{PLANS[plan].per}</button>
          <DemoPayNote />
        </div>
      )}

      {st === 'active' && (
        <button onClick={() => setSub({ ...sub, status: 'free', canceledAt: new Date().toISOString() })} className="w-full py-3 rounded-2xl bg-white/5 border border-white/10 hover:border-red-400/40 text-sm text-zinc-300 mb-6">Abo kündigen (du behältst die Gratis-Version)</button>
      )}

      <div className="glass rounded-2xl p-4 opacity-80">
        <div className="text-xs text-zinc-500 mb-2">🧪 Demo-Werkzeuge (nur zum Testen des Ablaufs)</div>
        <button onClick={() => setSub({ ...sub, status: 'trial', trialStart: new Date(Date.now() - (TRIAL_DAYS + 1) * DAY_MS).toISOString() })} className="text-sm text-zinc-400 hover:text-white underline">Trial-Ende simulieren (wechselt zur Gratis-Version)</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    // Kompiliert den App-Code mit klassischem JSX-Runtime (kein import-Injection) und führt ihn aus.
    (function () {
      try {
        var src = document.getElementById('app-code').textContent;
        var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
        (0, eval)(out);
      } catch (e) {
        console.error(e);
        document.getElementById('root').innerHTML =
          '<div style="max-width:520px;margin:80px auto;padding:24px;font-family:Inter,sans-serif;color:#fca5a5">'
          + '<h2 style="margin:0 0 8px">App konnte nicht starten</h2>'
          + '<pre style="white-space:pre-wrap;color:#f87171">' + (e && e.message ? e.message : e) + '</pre></div>';
      }
    })();
  </script>
</body>
